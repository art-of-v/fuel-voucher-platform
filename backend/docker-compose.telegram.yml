# Enables Telegram alert delivery from Grafana.
#
# Kept as a separate overlay because Grafana validates the bot token at startup and
# refuses to boot if it is empty - so the base stack stays runnable with no secrets.
#
# Requires backend/.env (git-ignored) containing:
#   TELEGRAM_BOT_TOKEN=123456:ABC-your-token
#   TELEGRAM_CHAT_ID=-1001234567890
#
# Run with:
#   docker compose -f docker-compose.observability.yml -f docker-compose.telegram.yml up -d

services:
  grafana:
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/alerting-telegram:/etc/grafana/provisioning/alerting:ro
      - grafana-data:/var/lib/grafana
