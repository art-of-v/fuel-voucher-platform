# There are deliberately no rule_files here. Alerting is evaluated by Grafana itself
# (backend/observability/grafana/provisioning/alerting-telegram/), and Prometheus only
# scrapes. The native rules that used to live in observability/prometheus/rules/ were a
# second copy of the same thresholds; nothing delivered them (no Alertmanager is
# configured), so they could only rot out of sync with the Grafana rules that do notify.
global:
  scrape_interval: 15s
  external_labels:
    # Distinguishes this stack's series from a future Hetzner deployment.
    environment: development

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The API and worker run on the host, not in this compose network.
  - job_name: fuelflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5202"]
        labels:
          service: fuelflow-api
          environment: development

  - job_name: fuelflow-jobs
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: fuelflow-jobs
          environment: development
