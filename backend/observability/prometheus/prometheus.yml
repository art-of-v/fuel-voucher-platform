global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Distinguishes this stack's series from a future Hetzner deployment.
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The API and worker run on the host, not in this compose network.
  - job_name: fuelflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5202"]
        labels:
          service: fuelflow-api
          environment: development

  - job_name: fuelflow-jobs
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: fuelflow-jobs
          environment: development
