auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  # Production mounts this same file, so the number is a production decision, not a dev default.
  # Seven days was shorter than the questions the dashboards ask: a weekly job is only visible in
  # the window between two runs, and its last failure could age out before anyone looked. Fifteen
  # days matches Prometheus' --storage.tsdb.retention.time=15d on both stacks, so a metric and the
  # log line that explains it are always queryable over the same window. The compactor deletes
  # what falls out, which is what `retention_enabled` below turns on.
  retention_period: 360h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
