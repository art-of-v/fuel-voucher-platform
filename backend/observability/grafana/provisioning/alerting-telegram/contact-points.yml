apiVersion: 1

# Alert delivery to a single Telegram group. Every message carries the environment
# and service labels so Development and Production alerts stay distinguishable.
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: fuelflow-telegram
        type: telegram
        settings:
          # The bot token is a credential, so it comes from the environment.
          bottoken: $TELEGRAM_BOT_TOKEN
          # The chat id is a LITERAL, and that is deliberate - the reason is long, and it
          # is the whole reason this file says what it says.
          #
          # Grafana substitutes $VAR into this YAML and parses the result again. A chat
          # id is a negative number, so it parses as a YAML NUMBER, and Grafana's
          # Telegram integration wants a string. It says so and refuses to start:
          #
          #   cannot unmarshal number into Go struct field Config.chatid of type string
          #
          # and because the contact point is the first thing the alerting provisioning
          # reads, the whole provisioning dies with it: no rules, no contact point, and
          # Grafana exits 1 and restart-loops. That is not a theory - it is what the
          # production box did on 2026-10-22 when the overlay was applied, and why the
          # metric-based alerting had never run there: the stack was started without the
          # overlay, and with it Grafana would not start at all.
          #
          # Quoting the placeholder does NOT help. The quotes are consumed with the
          # substitution, so the value arrives with its quotes inside it, and Telegram
          # answers "chat not found" to every alert (400 Bad Request) - the rules
          # evaluate, the state is right, and nothing reaches anybody. Measured on the
          # box: with the quoted placeholder the provisioning succeeds and every
          # notification fails with
          #
          #   failed to send telegram message: webhook response status 400 Bad Request
          #
          # A chat id is an identifier, not a credential - without the bot token it
          # reaches nothing - so it belongs in the repository, where it is visible in a
          # diff and cannot drift silently. deploy/preflight.sh checks that it still
          # matches TELEGRAM_CHAT_ID in deploy/.env, so the two cannot disagree, and
          # deploy/check-alerting-provisioning.sh checks that this file loads at all.
          chatid: "-5510388216"
          parse_mode: HTML
          message: |
            {{- /* Prometheus rules label by `job`, Loki rules by `service`. Fall back
                   between them so the header is never blank.

                   NOTE: $$src (double dollar), not $src. Grafana runs env-var
                   interpolation over provisioned contact-point settings BEFORE Go
                   templating, and settings.message is not on its exception list. A
                   bare $src has no matching env var, so it is replaced with "" and the
                   template becomes `{{  := ... }}` — invalid, so NO alert ever renders.
                   `$$` escapes to a literal `$`, leaving `{{ $src ... }}` intact. */ -}}
            {{ $$src := or .CommonLabels.job .CommonLabels.service "fuelflow" -}}
            {{ if eq .Status "firing" }}🔴 <b>[{{ .CommonLabels.environment }}/{{ $$src }}] {{ .CommonLabels.alertname }}</b>
            Status: FIRING{{ else }}✅ <b>[{{ .CommonLabels.environment }}/{{ $$src }}] {{ .CommonLabels.alertname }}</b>
            Status: RESOLVED - back to normal{{ end }}
            {{ range .Alerts }}
            {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}

policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - alertname
      - environment
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
