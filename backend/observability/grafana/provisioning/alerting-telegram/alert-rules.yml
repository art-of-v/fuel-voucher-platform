apiVersion: 1

# Grafana-managed alert rules. These cover conditions the application cannot report
# about itself (a dead process cannot send a Telegram message), so they are evaluated
# by Grafana against Prometheus and delivered through the `telegram` contact point.
#
# This file is the only alert-rule source. Prometheus used to carry a second copy of
# the same thresholds in observability/prometheus/rules/; no Alertmanager was ever
# configured, so that copy could not notify anybody and could only drift - the two
# had already diverged on labels. It was removed, and Prometheus now scrapes only.
#
# Grafana sends BOTH firing and resolved notifications, so "app is down" (firing) and
# "app is up" (resolved) are the same rule - see contact-points.yml message template.
#
# A rule whose HEALTHY value is zero has to say so, and it is not decoration. PromQL returns no
# series at all for a counter/label pair that has never been observed, and an observable gauge fed
# no rows emits nothing either; a Loki query over zero matching lines returns nothing by its own
# nature. So a system behaving perfectly produces an empty result, the rule sits in NoData for
# ever, and that looks exactly like an exporter that stopped reporting. Measured on 2026-10-27:
# nine of thirteen rules had been in NoData since the volumes were recreated, and a Telegram was
# going out every four hours. Two mechanisms, one per datasource:
#   - Prometheus rules carry `or vector(0)`: the healthy case becomes an honest 0 = Normal. A
#     scrape that genuinely fails is ServiceDown's job to report, not theirs.
#   - Loki rules carry `noDataState: OK`: "no matching lines" IS the healthy state, so NoData
#     must not be a state that notifies.
groups:
  - orgId: 1
    name: fuelflow-availability
    folder: FuelFlow
    interval: 1m
    rules:
      - uid: fuelflow-service-down
        title: ServiceDown
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes. When this alert resolves the service is back up."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: up{job=~"fuelflow-.*"}
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

  - orgId: 1
    name: fuelflow-http
    folder: FuelFlow
    interval: 1m
    rules:
      - uid: fuelflow-high-error-rate
        title: HighErrorRate
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.job }} error rate above 5%"
          description: "More than 5% of HTTP responses have been 5xx for 5 minutes. Current ratio: {{ $values.B }}."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # Grouped, because `or` has the lowest precedence: without the parentheses the
              # right-hand vector(0) would join only the divisor and the ratio would stay empty.
              expr: |
                (
                  sum by (job, service, environment) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                    /
                  clamp_min(sum by (job, service, environment) (rate(http_server_request_duration_seconds_count[5m])), 0.0001)
                )
                  or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: fuelflow-high-latency
        title: HighRequestLatency
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "{{ $labels.job }} p95 latency above 2s"
          description: "95th percentile request duration has exceeded 2 seconds for 10 minutes."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: |
                histogram_quantile(0.95, sum by (job, service, environment, le) (rate(http_server_request_duration_seconds_bucket[5m])))
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }

  - orgId: 1
    name: fuelflow-resources
    folder: FuelFlow
    interval: 1m
    rules:
      - uid: fuelflow-high-cpu
        title: HighCpuUsage
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "{{ $labels.job }} CPU usage is high"
          description: "Process CPU usage has stayed above 85% of a single core for 10 minutes. Current value: {{ $values.B }}%."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # process.cpu.time is exported in seconds-of-CPU; the rate is the number of
              # cores consumed, so *100 yields percent-of-one-core.
              expr: sum by (job, service, environment) (rate(process_cpu_time_seconds_total[5m])) * 100
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [85] }

      - uid: fuelflow-high-memory
        title: HighMemoryUsage
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "{{ $labels.job }} memory usage is high"
          description: "Working set has stayed above 1.5 GB for 10 minutes. Current value: {{ $values.B }} bytes."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (job, service, environment) (process_memory_usage_bytes)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1610612736] }

  - orgId: 1
    name: fuelflow-logs
    folder: FuelFlow
    interval: 1m
    rules:
      # The #246 concurrency detector. ApplicationDbContext logs every DbUpdateConcurrencyException
      # at Warning with the entity type and key, precisely so the next step can read which handlers
      # genuinely race instead of guessing from the source. LogErrorBurst below filters
      # level=~"error|fatal", so without this rule that evidence reaches nobody: the detector fires,
      # writes a line, and no alert and no human ever sees it. Same shape as the retention job that
      # nobody had ever switched on - an instrument nobody watches is not evidence.
      #
      # Fires on the FIRST hit rather than on a rate, because a single collision is the whole point:
      # it names the entity and key that raced, which is what #246 needs to choose the next handler
      # to convert. A rate threshold here would hide exactly the rare, informative case.
      - uid: fuelflow-concurrency-conflict
        title: ConcurrencyConflict
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "{{ $labels.service }} hit a concurrency conflict ({{ $values.B }})"
          description: "A tracked write was refused because the row changed since it was read. The 409 is correct behaviour - the caller retries - but the entity type and key in the log line are the evidence #246 needs. Search Grafana > FuelFlow Logs for \"Concurrency conflict on\" to read them."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum(count_over_time({level="warning"} |= "Concurrency conflict on" [5m]))
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The per-job counterpart of HangfireJobFailures, which thresholds a rate over ten minutes
      # and only after ten minutes of it. A daily job that fails once, or a weekly one, produces a
      # single increment and resolves before that rule may ever fire - the failure is real, the
      # counter says so, and nobody is told. MetricsJobFilter writes exactly one line per failed
      # run, carrying the job type, the job name, the duration and the exception, so this rule
      # fires on the first hit and the notification names the job instead of a bare counter.
      #
      # The window is wider than the metric rule's on purpose: it has to cover one evaluation of
      # the longest recurring interval worth noticing, otherwise the line scrolls out of the query
      # before Grafana looks. Grouping is by body fields, which is why the query needs `| json`.
      - uid: fuelflow-job-failed
        title: JobFailed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Background job {{ $labels.JobType }}.{{ $labels.JobName }} failed"
          description: "{{ $values.B }} failed run(s) in the last 30 minutes. The exception, stack trace and duration are in the log line - search Grafana > FuelFlow Logs for \"Background job\"."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum by (JobType, JobName) (count_over_time({level="error"} |= "Background job" | json [30m]))
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # Catches errors that never reach the HTTP metrics or the app's own Telegram
      # dispatcher - e.g. controllers that catch an exception, log it and return a
      # response themselves. Serilog promotes `level` to a Loki label, so this is a
      # cheap label-only query and does not scan log bodies.
      - uid: fuelflow-log-error-burst
        title: LogErrorBurst
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "{{ $labels.service }} is logging errors"
          description: "More than 5 error-level log lines per minute for 5 minutes ({{ $values.B }}/min). Check Grafana > FuelFlow Logs for details."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum by (service, environment) (rate({level=~"error|fatal"}[5m])) * 60
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }

      # A single Fatal line means the process is about to die or has lost a critical
      # dependency, so this fires immediately rather than on a rate.
      - uid: fuelflow-log-fatal
        title: LogFatal
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "{{ $labels.service }} logged a FATAL error"
          description: "A fatal-level log line was emitted. The service is likely shutting down or has lost a critical dependency."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum by (service, environment) (count_over_time({level="fatal"}[5m]))
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: fuelflow-business
    folder: FuelFlow
    interval: 5m
    rules:
      - uid: fuelflow-voucher-pool-low
        title: VoucherPoolLow
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Voucher pool is running low"
          # The gauge reports one series per brand and fuel type, so this rule has one instance per
          # combination - and without the labels in the message, three exhausted combinations would
          # arrive as three identical lines. The pool gauge also emits a single untagged zero when
          # there is no inventory at all, and then the labels are empty and the sentence stays as it
          # was.
          description: "Only {{ $values.B }} unassigned vouchers remain{{ if $labels.brand }} for {{ $labels.brand }} {{ $labels.fuel_type }}{{ end }}."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: fuelflow_vouchers_pool_available_vouchers or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [10] }

      - uid: fuelflow-fulfillment-failures
        title: FulfillmentFailures
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Order fulfillment is failing"
          description: "Fulfillment failures have been observed continuously for 10 minutes."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (job, service, environment) (rate(fuelflow_fulfillment_failed_orders_total[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: fuelflow-job-failures
        title: HangfireJobFailures
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Background jobs are failing"
          description: "One or more recurring Hangfire jobs have failed repeatedly."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (job, service, environment) (rate(fuelflow_jobs_failed_jobs_total[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The one that matters most for revenue. An order sitting in PendingPayment past the
      # reconciliation grace window means the webhook did not confirm the payment AND the
      # reconciliation poll did not recover it - so a customer has paid and is not getting a
      # voucher. Zero in normal operation, so any sustained non-zero is a real incident.
      #
      # Deliberately not fuelflow.orders.by_status: the overwhelming majority of awaiting-payment
      # orders are carts nobody has paid yet, so a rule on that fires on healthy traffic and
      # trains everyone to ignore it.
      - uid: fuelflow-payments-stuck
        title: PaymentsStuck
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Payments are stuck - customers may have paid without receiving vouchers"
          description: "{{ $values.B }} order(s) have been awaiting payment past the reconciliation grace window. The Monobank webhook is not confirming payments and reconciliation is not recovering them. Check webhook logs and the merchant's webhook signing key."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # sum(), not the per-merchant series: the alert is about money being stuck, and
              # one message per stuck order would be noise during an incident.
              expr: sum(fuelflow_payments_stuck_pending_payment) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: fuelflow-security
    folder: FuelFlow
    interval: 5m
    rules:
      # Strict refresh-token reuse detection revoked a token family. Benign lost-rotation
      # replays are absorbed by the grace window (#26) as grace_recovered and are NOT counted
      # here, so a sustained reuse_revoked rate is a genuine stolen-token replay or a client
      # leaking rotations past RefreshReuseGraceSeconds.
      - uid: fuelflow-refresh-reuse-spike
        title: RefreshTokenReuseSpike
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Refresh-token reuse detections are firing"
          description: "Refresh-token families are being revoked by strict reuse detection continuously for 10 minutes - a possible stolen-token replay, or a client leaking rotations past the grace window."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (service, environment) (rate(fuelflow_auth_refresh_events_total{outcome="reuse_revoked"}[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
