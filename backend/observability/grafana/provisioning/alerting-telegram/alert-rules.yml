apiVersion: 1

# Grafana-managed alert rules. These cover conditions the application cannot report
# about itself (a dead process cannot send a Telegram message), so they are evaluated
# by Grafana against Prometheus and delivered through the `telegram` contact point.
#
# This file is the only alert-rule source. Prometheus used to carry a second copy of
# the same thresholds in observability/prometheus/rules/; no Alertmanager was ever
# configured, so that copy could not notify anybody and could only drift - the two
# had already diverged on labels. It was removed, and Prometheus now scrapes only.
#
# Grafana sends BOTH firing and resolved notifications, so "app is down" (firing) and
# "app is up" (resolved) are the same rule - see contact-points.yml message template.
#
# A rule whose HEALTHY value is zero has to say so, and it is not decoration. PromQL returns no
# series at all for a counter/label pair that has never been observed, and an observable gauge fed
# no rows emits nothing either; a Loki query over zero matching lines returns nothing by its own
# nature. So a system behaving perfectly produces an empty result, the rule sits in NoData for
# ever, and that looks exactly like an exporter that stopped reporting. Measured on 2026-10-27:
# nine of thirteen rules had been in NoData since the volumes were recreated, and a Telegram was
# going out every four hours. Two mechanisms, one per datasource:
#   - Prometheus rules carry a fallback to an honest 0, but the fallback has to match the label
#     set of what it falls back for. `or` matches by label set, so `or vector(0)` adds the single
#     series `{}`, which is the same series only when the query already aggregates its labels away
#     (`sum(...)`, `absent(...)`). Next to a labelled series (`sum by (...)`, a bare gauge) it is a
#     separate instance, and under a `lt` threshold that instance is a permanent firing alert with
#     no labels - planning #778. A labelled query that needs both an honest zero and an honest
#     absence gets two rules. A scrape that genuinely fails is ServiceDown's job to report.
#   - Loki rules carry `noDataState: OK`: "no matching lines" IS the healthy state, so NoData
#     must not be a state that notifies.
groups:
  - orgId: 1
    name: fuelflow-availability
    folder: FuelFlow
    interval: 1m
    rules:
      - uid: fuelflow-service-down
        title: ServiceDown
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes. When this alert resolves the service is back up."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: up{job=~"fuelflow-.*"}
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

  - orgId: 1
    name: fuelflow-http
    folder: FuelFlow
    interval: 1m
    rules:
      - uid: fuelflow-high-error-rate
        title: HighErrorRate
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.job }} error rate above 5%"
          description: "More than 5% of HTTP responses have been 5xx for 5 minutes. Current ratio: {{ $values.B }}."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # Grouped, because `or` has the lowest precedence: without the parentheses the
              # right-hand vector(0) would join only the divisor and the ratio would stay empty.
              expr: |
                (
                  sum by (job, service, environment) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                    /
                  clamp_min(sum by (job, service, environment) (rate(http_server_request_duration_seconds_count[5m])), 0.0001)
                )
                  or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: fuelflow-high-latency
        title: HighRequestLatency
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "{{ $labels.job }} p95 latency above 2s"
          description: "95th percentile request duration has exceeded 2 seconds for 10 minutes."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: |
                histogram_quantile(0.95, sum by (job, service, environment, le) (rate(http_server_request_duration_seconds_bucket[5m])))
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }

  - orgId: 1
    name: fuelflow-resources
    folder: FuelFlow
    interval: 1m
    rules:
      - uid: fuelflow-high-cpu
        title: HighCpuUsage
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "{{ $labels.job }} CPU usage is high"
          description: "Process CPU usage has stayed above 85% of a single core for 10 minutes. Current value: {{ $values.B }}%."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # process.cpu.time is exported in seconds-of-CPU; the rate is the number of
              # cores consumed, so *100 yields percent-of-one-core.
              expr: sum by (job, service, environment) (rate(process_cpu_time_seconds_total[5m])) * 100
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [85] }

      - uid: fuelflow-high-memory
        title: HighMemoryUsage
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "{{ $labels.job }} memory usage is high"
          description: "Working set has stayed above 1.5 GB for 10 minutes. Current value: {{ $values.B }} bytes."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (job, service, environment) (process_memory_usage_bytes)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1610612736] }

  - orgId: 1
    name: fuelflow-logs
    folder: FuelFlow
    interval: 1m
    rules:
      # The #246 concurrency detector. ApplicationDbContext logs every DbUpdateConcurrencyException
      # at Warning with the entity type and key, precisely so the next step can read which handlers
      # genuinely race instead of guessing from the source. LogErrorBurst below filters
      # level=~"error|fatal", so without this rule that evidence reaches nobody: the detector fires,
      # writes a line, and no alert and no human ever sees it. Same shape as the retention job that
      # nobody had ever switched on - an instrument nobody watches is not evidence.
      #
      # Fires on the FIRST hit rather than on a rate, because a single collision is the whole point:
      # it names the entity and key that raced, which is what #246 needs to choose the next handler
      # to convert. A rate threshold here would hide exactly the rare, informative case.
      - uid: fuelflow-concurrency-conflict
        title: ConcurrencyConflict
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "{{ $labels.service }} hit a concurrency conflict ({{ $values.B }})"
          description: "A tracked write was refused because the row changed since it was read. The 409 is correct behaviour - the caller retries - but the entity type and key in the log line are the evidence #246 needs. Search Grafana > FuelFlow Logs for \"Concurrency conflict on\" to read them."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum(count_over_time({level="warning"} |= "Concurrency conflict on" [5m]))
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The per-job counterpart of HangfireJobFailures, which thresholds a rate over ten minutes
      # and only after ten minutes of it. A daily job that fails once, or a weekly one, produces a
      # single increment and resolves before that rule may ever fire - the failure is real, the
      # counter says so, and nobody is told. MetricsJobFilter writes exactly one line per failed
      # run, carrying the job type, the job name, the duration and the exception, so this rule
      # fires on the first hit and the notification names the job instead of a bare counter.
      #
      # The window is wider than the metric rule's on purpose: it has to cover one evaluation of
      # the longest recurring interval worth noticing, otherwise the line scrolls out of the query
      # before Grafana looks. Grouping is by body fields, which is why the query needs `| json`.
      - uid: fuelflow-job-failed
        title: JobFailed
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Background job {{ $labels.JobType }}.{{ $labels.JobName }} failed"
          description: "{{ $values.B }} failed run(s) in the last 30 minutes. The exception, stack trace and duration are in the log line - search Grafana > FuelFlow Logs for \"Background job\"."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum by (JobType, JobName) (count_over_time({level="error"} |= "Background job" | json [30m]))
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # Catches errors that never reach the HTTP metrics or the app's own Telegram
      # dispatcher - e.g. controllers that catch an exception, log it and return a
      # response themselves. Serilog promotes `level` to a Loki label, so this is a
      # cheap label-only query and does not scan log bodies.
      - uid: fuelflow-log-error-burst
        title: LogErrorBurst
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "{{ $labels.service }} is logging errors"
          description: "More than 5 error-level log lines per minute for 5 minutes ({{ $values.B }}/min). Check Grafana > FuelFlow Logs for details."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum by (service, environment) (rate({level=~"error|fatal"}[5m])) * 60
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }

      # A single Fatal line means the process is about to die or has lost a critical
      # dependency, so this fires immediately rather than on a rate.
      - uid: fuelflow-log-fatal
        title: LogFatal
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "{{ $labels.service }} logged a FATAL error"
          description: "A fatal-level log line was emitted. The service is likely shutting down or has lost a critical dependency."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fuelflow-loki
            model:
              refId: A
              expr: sum by (service, environment) (count_over_time({level="fatal"}[5m]))
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: fuelflow-business
    folder: FuelFlow
    interval: 5m
    rules:
      - uid: fuelflow-voucher-pool-low
        title: VoucherPoolLow
        condition: C
        for: 5m
        # Absence is not a zero: with no series the rule says nothing, and the rule below says the
        # gauge is gone. NoData here would notify as well, so one missing gauge would arrive twice.
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Voucher pool is running low"
          # The gauge reports one series per brand, fuel type and pack size - the grain a sale is
          # matched on - so this rule has one instance per combination, and without the labels in
          # the message several exhausted combinations would arrive as identical lines. The size is
          # part of the sentence for the same reason: a 10 L shortage and a 20 L shortage are two
          # different things to buy. An untagged series means the pool carries no inventory at all:
          # the gauge emits a single zero in that case, so the sentence stays as it was.
          description: "Only {{ $values.B }} unassigned vouchers remain{{ if $labels.brand }} for {{ $labels.brand }} {{ $labels.fuel_type }}{{ if $labels.liters }} {{ $labels.liters }} L{{ end }}{{ end }}."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # No untagged zero fallback: `or` matches by label set, so it would be a separate
              # instance next to every labelled one, and 0 is below the threshold - a permanent
              # firing alert with no brand and no fuel type (planning #778).
              expr: fuelflow_vouchers_pool_available_vouchers
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [10] }

      # The gauge always has at least one series - a pool that carries no inventory at all still
      # reports an untagged zero (BusinessGaugeSetup.ZeroWhenEmpty). So no series means the gauge or
      # the exporter is broken, and that is a different incident from "the pool ran out": it used to
      # arrive as "Only 0 unassigned vouchers remain", indistinguishable from a real stock-out.
      # `absent()` is empty while the metric exists, so the `or vector(0)` here is an honest healthy
      # zero - and both sides are the untagged `{}` series, so no phantom can fork off it.
      - uid: fuelflow-voucher-pool-metric-absent
        title: VoucherPoolMetricAbsent
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "The voucher pool gauge is missing"
          description: "Prometheus has no series for fuelflow_vouchers_pool_available_vouchers, so VoucherPoolLow cannot see the pool at all. The exporter scrape or the gauge registration is broken - this is not an empty pool. Check /metrics on the API and the Prometheus target."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: absent(fuelflow_vouchers_pool_available_vouchers) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: fuelflow-fulfillment-failures
        title: FulfillmentFailures
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Order fulfillment is failing"
          description: "Fulfillment failures have been observed continuously for 10 minutes."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (job, service, environment) (rate(fuelflow_fulfillment_failed_orders_total[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: fuelflow-job-failures
        title: HangfireJobFailures
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Background jobs are failing"
          description: "One or more recurring Hangfire jobs have failed repeatedly."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (job, service, environment) (rate(fuelflow_jobs_failed_jobs_total[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The one that matters most for revenue. An order sitting in PendingPayment past the
      # reconciliation grace window means the webhook did not confirm the payment AND the
      # reconciliation poll did not recover it - so a customer has paid and is not getting a
      # voucher. Zero in normal operation, so any sustained non-zero is a real incident.
      #
      # Deliberately not fuelflow.orders.by_status: the overwhelming majority of awaiting-payment
      # orders are carts nobody has paid yet, so a rule on that fires on healthy traffic and
      # trains everyone to ignore it.
      - uid: fuelflow-payments-stuck
        title: PaymentsStuck
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Payments are stuck - customers may have paid without receiving vouchers"
          description: "{{ $values.B }} order(s) have been awaiting payment past the reconciliation grace window. The Monobank webhook is not confirming payments and reconciliation is not recovering them. Check webhook logs and the merchant's webhook signing key."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # sum(), not the per-merchant series: the alert is about money being stuck, and
              # one message per stuck order would be noise during an incident.
              expr: sum(fuelflow_payments_stuck_pending_payment) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # #824. Money the acquirer took that no payment row of ours holds. Nothing books it
      # automatically - an unexplained receipt becomes a liability under a named operator - so the
      # only other notice was the statement pass's warning line, found at the close.
      #
      # The gauge is set by the hourly statement pass, and a capture can legitimately take up to an
      # hour to appear in the statement, so the rule waits two hours before calling it a fault.
      # NoData is a brief, honest state after a restart (the pass has not reported yet); a gauge that
      # has reported says 0, so "we looked and there is nothing" is a value, not silence.
      - uid: fuelflow-unbooked-captures
        title: UnbookedCaptures
        condition: C
        for: 2h
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "{{ $values.B }} received capture(s) have no payment row and are not in the books"
          description: "The acquirer's live statement holds charges the payments table cannot explain. Book them before the period closes with POST /api/admin/ledger/unapplied-receipts, naming the invoices from the statement pass warning line; the procedure is in docs/RECONCILIATION.md."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: fuelflow_payments_unbooked_captures
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # #824. A delivery that ended Failed: the money step threw, an amount did not match, or an
      # invoice had no order. reconcile-monobank-payments re-feeds the invoice every two minutes, so
      # a single failure may already be recovering; a sustained count is a money path that is not
      # settling. The row's error column and the API log name the invoice.
      - uid: fuelflow-webhook-delivery-failed
        title: WebhookDeliveryFailed
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Monobank webhooks are failing ({{ $values.B }} in the last ten minutes)"
          description: "At least one delivery ended Failed. Check webhook_events.error for the invoice and the API log for the exception; the order may still be recoverable by the reconciliation poll, which re-feeds the same handler."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              # reason is deliberately aggregated away: the alert is "a money path is failing",
              # and the reason belongs in the log line the operator opens next.
              expr: sum(increase(fuelflow_monobank_webhook_failed_webhooks_total[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # #824. A duplicate is normal by design: Monobank retries, and a retry that finds the work done
      # is the system working. Only a burst is worth waking someone - it means the delivery is not
      # being acknowledged (a 5xx loop), a client keeps re-polling the same state, or a retry storm
      # is under way.
      - uid: fuelflow-webhook-duplicate-burst
        title: WebhookDuplicateBurst
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Monobank is redelivering webhooks in a burst ({{ $values.B }} duplicates in ten minutes)"
          description: "More than 20 duplicate deliveries in ten minutes, sustained. Check that the webhook endpoint answers 200 and that the event is being recorded - a redelivery loop is what an unacknowledged delivery looks like from the acquirer's side."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 1200, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum(increase(fuelflow_monobank_webhook_duplicate_webhooks_total[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [20] }

      # A feed that stops is not an error anywhere else in the stack. Every pump-price sync keeps the
      # last known prices when its fetch fails - deliberately, so an outage cannot blank the
      # catalogue - and the job returns normally, so nothing reaches Hangfire's failed state and
      # LogErrorBurst (more than 5 error lines a minute) never trips on one line every quarter hour.
      # Measured on 2026-10-29: WOG's seven grades had not moved for nineteen hours and the only
      # evidence was a Loki error line nobody was watching.
      #
      # Healthy here is a NUMBER, not an empty result: the gauge reports the age in seconds for every
      # brand that has live fuels, so the usual `or vector(0)` would turn "the gauge could not be
      # read" into a healthy zero - the one case this alarm must not swallow. That is why it is the
      # only Prometheus rule whose noDataState alerts.
      - uid: fuelflow-price-sync-stale
        title: PriceSyncStale
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.brand }} pump prices are more than an hour old"
          description: "The {{ $labels.brand }} price feed has not written a pump price for {{ $values.B }} seconds (threshold 3600). The last known prices are still being served and the customer's saving is measured against them, so the app may be advertising a saving against a price the station no longer charges. The vendor's page may have changed shape, be down, or refuse our requests - search Grafana > FuelFlow Logs for the sync's error line."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: fuelflow_fuel_prices_last_sync_age_seconds
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3600] }

  - orgId: 1
    name: fuelflow-security
    folder: FuelFlow
    interval: 5m
    rules:
      # Strict refresh-token reuse detection revoked a token family. Benign lost-rotation
      # replays are absorbed by the grace window (#26) as grace_recovered and are NOT counted
      # here, so a sustained reuse_revoked rate is a genuine stolen-token replay or a client
      # leaking rotations past RefreshReuseGraceSeconds.
      - uid: fuelflow-refresh-reuse-spike
        title: RefreshTokenReuseSpike
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "Refresh-token reuse detections are firing"
          description: "Refresh-token families are being revoked by strict reuse detection continuously for 10 minutes - a possible stolen-token replay, or a client leaking rotations past the grace window."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (service, environment) (rate(fuelflow_auth_refresh_events_total{outcome="reuse_revoked"}[10m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: fuelflow-updates
    folder: FuelFlow
    interval: 5m
    rules:
      # An OTA channel holds one manifest per platform and runtime version, and the publisher signs
      # the commit it was built from into it. The API compares that commit time with the last one it
      # served for the same pair (ServedManifestTracker, F-13). A rise here means every install
      # asking for that runtime was handed older JavaScript than it already had: a publish from a
      # stale checkout, a hand-repaired object, or a deliberate --allow-downgrade. The script refuses
      # the first case, so what reaches this counter is the fleet actually moving backward - which is
      # worth a person looking at the channel, not a trend line.
      - uid: fuelflow-ota-manifest-rollback
        title: OtaManifestRollback
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: OK
        annotations:
          summary: "An OTA channel is serving an older manifest"
          description: "The OTA manifest for one platform and runtime version is older than the one served before it. Every install asking for that runtime is receiving older JavaScript than it already had."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fuelflow-prometheus
            model:
              refId: A
              expr: sum by (service, environment) (increase(fuelflow_updates_manifest_rollback_events_total[15m])) or vector(0)
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, reducer: last, expression: A }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
