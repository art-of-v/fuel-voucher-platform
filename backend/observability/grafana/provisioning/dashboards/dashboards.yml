apiVersion: 1

providers:
  - name: fuelflow
    orgId: 1
    folder: FuelFlow
    type: file
    disableDeletion: false
    # Dashboards are provisioned from source control, so edits made in the UI are
    # transient by design. Use "Save JSON to file" and commit the result instead.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
