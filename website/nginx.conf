# nginx for the marketing site container. Copied to /etc/nginx/conf.d/default.conf.
#
# The site is a fully static Next.js export (out/), so this config only serves
# files - there is no SPA fallback, no /api proxy. Security headers are set once
# at the edge in deploy/Caddyfile so the configs cannot drift.

server {
    listen 5001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Next's `trailingSlash: true` export emits directory-style paths
    # (/support/ -> /support/index.html). $uri/ handles them; the named
    # @fallback serves 404.html for everything else instead of nginx's default.
    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        # Permanent redirects keep old links (e.g. from search results) alive.
        # If 404.html is missing, the error_page directive falls through to 500.
        try_files /404.html =404;
    }

    error_page 404 /404.html;

    # Hashed build assets are content-addressed and never change: cache hard.
    # The Caddy edge layer adds nothing for these, so this header is the only one.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (HTML, images): revalidate each time so redeployments
    # reach visitors immediately.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
}
