# nginx for the marketing site container. Copied to /etc/nginx/conf.d/default.conf.
#
# The site is a fully static Next.js export (out/), so this config only serves
# files - there is no SPA fallback, no /api proxy. Security headers are set once
# at the edge in deploy/Caddyfile so the configs cannot drift.
#
# Cache-Control lives here rather than at the edge because nginx is the only
# thing that knows which paths are content-addressed. next.config.ts cannot set
# headers at all - `headers()` is a Next server feature and is silently ignored
# under `output: 'export'`.

server {
    listen 5001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Default for every response: revalidate on use.
    #
    # The HTML document is not content-addressed, so a redeploy can only reach a
    # visitor if the browser decides to revalidate. With no Cache-Control nginx
    # emits just Last-Modified and ETag, and that pair is exactly what makes
    # browsers apply heuristic caching - which is how a phone can still be
    # showing the previous build minutes after a deploy landed. The header has
    # to be stated; the absence of one is not a neutral default.
    #
    # Note for anyone adding a location below: an add_header in a location
    # REPLACES this inherited set rather than adding to it, so a location that
    # sets one header is setting the whole set. Fine here, because the only
    # header nginx ever sets is this one.
    add_header Cache-Control "no-cache, must-revalidate" always;

    # Next's `trailingSlash: true` export emits directory-style paths
    # (/support/ -> /support/index.html), which $uri/ resolves.
    #
    # `=404` and not a named location that serves /404.html directly: serving the
    # file straight from try_files answers 200, so a page that does not exist
    # reports success and the error_page below never runs. Raising the 404 and
    # letting error_page rewrite it keeps the status honest while still returning
    # a styled page.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Hashed build assets are content-addressed and never change: cache hard.
    #
    # The `^~` is a guard, and it is here because this block used to be
    # unreachable dead code. nginx remembers the longest prefix match but then
    # lets a regex location override it, so while the regex below listed js and
    # css it matched every hashed build asset and won, and this header was never
    # sent at all - every asset quietly revalidated on every page load. js and
    # css are gone from that regex now, so the prefix wins on its own; `^~` means
    # it stops winning by accident the first time somebody adds an extension
    # back. Without it the failure is silent either way: nginx starts happily and
    # just stops caching.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images, fonts and manifests: stable names, replaceable bytes. Revalidate
    # rather than cache hard, so a redeploy that swaps the bytes behind a name
    # still reaches visitors.
    #
    # js and css are deliberately absent. In this export they only ever exist
    # under /_next/static/, which the block above owns; listing them here would
    # shadow that block all over again for anything that ever moved.
    location ~* \.(png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|txt|xml|json|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
}