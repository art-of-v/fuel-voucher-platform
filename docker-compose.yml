services:
  admin-database:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: fuel-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fuel_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: fuel-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  dotnet-backend:
    build:
      context: ./backend
      dockerfile: src/FuelFlow.API/Dockerfile
    container_name: fuel-dotnet-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Database__ConnectionString=Host=admin-database;Port=5432;Database=fuel_db_dotnet;Username=postgres;Password=postgres;SSL Mode=Disable;Trust Server Certificate=true;
      - ConnectionStrings__Redis=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - Monobank__Token=${MONOBANK_API_TOKEN}
      - Monobank__WebhookUrl=${MONOBANK_WEBHOOK_URL}
      - Monobank__Enabled=true
      - Monobank__BaseUrl=https://api.monobank.ua
      - Monobank__RedirectUrl=fuelflow://payment-result
    depends_on:
      admin-database:
        condition: service_healthy

  admin-frontend:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: fuel-admin-frontend
    restart: unless-stopped
    ports:
      - "5002:5000"
    depends_on:
      - dotnet-backend

  mobile-app:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: fuel-mobile-app
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://dotnet-backend:8080
    ports:
      - "5003:5000"
    depends_on:
      - dotnet-backend

volumes:
  postgres_data:
