# Prometheus configuration for the PRODUCTION stack (Hetzner).
#
# Difference from the local development config
# (backend/observability/prometheus/prometheus.yml): the API runs as the
# `dotnet-backend` compose service on the `fuelflow_default` network, so the
# target is the service name instead of host.docker.internal, and every label
# says production. There is no separate JobsWorker in production — Hangfire jobs
# run in-process inside the API — so there is no fuelflow-jobs target.
#
# Alert rules are mounted from backend/observability/prometheus/rules/ (shared
# with local dev) by deploy/docker-compose.observability.yml. The
# MetricNameContractTests guard the rule/metric name contract in CI.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fuelflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["dotnet-backend:8080"]
        labels:
          service: fuelflow-api
          environment: production
