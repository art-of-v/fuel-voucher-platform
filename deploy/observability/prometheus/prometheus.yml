# Prometheus configuration for the PRODUCTION stack (Hetzner).
#
# Difference from the local development config
# (backend/observability/prometheus/prometheus.yml): the API runs as the
# `fuelflow-backend` compose service on the `fuelflow_default` network, so the
# target is the service name instead of host.docker.internal, and every label
# says production. There is no separate JobsWorker in production — Hangfire jobs
# run in-process inside the API — so there is no fuelflow-jobs target.
#
# No rule_files: alerting is evaluated by Grafana, which reads this Prometheus
# through the provisioned datasource and is the only path that delivers anything
# (no Alertmanager runs here). The thresholds live in
# backend/observability/grafana/provisioning/alerting-telegram/alert-rules.yml,
# and MetricNameContractTests guard the rule/metric name contract in CI.

global:
  scrape_interval: 15s
  external_labels:
    environment: production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fuelflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["fuelflow-backend:8080"]
        labels:
          service: fuelflow-api
          environment: production
