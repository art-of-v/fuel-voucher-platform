events {}

http {
# Docker's embedded DNS. Without this, nginx resolves `loki` once at startup and dials that IP for
# the life of the process: recreating the loki container gives it a new address, and the gateway
# keeps pushing to the dead one (logs stop reaching Loki while Grafana merely shows "No data").
# Resolving inside proxy_pass makes nginx ask again per request, bounded by valid=10s.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name _;

    access_log off;

    location = /loki/api/v1/push {
        limit_except POST { deny all; }

        if ($http_authorization != "Basic __LOKI_BASIC_TOKEN__") { return 401; }

        set $loki_upstream http://loki:3100;
        proxy_pass $loki_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
}
