# FuelFlow — production stack for a single Hetzner server (CX22, 4 GB / 2 vCPU).
# Deploys happen automatically via CI (".github/workflows/ci.yml" → "Deploy to
# Hetzner"); this compose file is what CI builds and runs. Runbook:
# docs/DEPLOYMENT.md.
#
# Manual use (rollback / server restart):
#   cd ~/FuelFlow/deploy
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# Services (all on one private Docker network):
#   caddy          - the only thing exposed to the internet; automatic HTTPS + reverse proxy
#   dotnet-backend - the .NET 10 API (Hangfire background jobs run in-process; no separate worker)
#   admin-frontend - React admin SPA (nginx); also proxies /api -> backend, so it's same-origin
#   postgres       - self-hosted database; data lives in the named volume `postgres_data`
#   redis          - cache
#
# Postgres and Redis are bound to localhost only and never exposed to the internet.
#
# --- Memory limits -------------------------------------------------------------------
# Every service has a mem_limit. Sized for the Hetzner CX22 (4 GB RAM / 2 vCPU —
# originally deployed on a 2 GB server, docs/DEPLOYMENT.md) with 2 GB of swap as
# the safety net:
#
#   dotnet-backend  896M   | postgres 512M | redis 192M | caddy 96M | admin 64M | website 32M
#   total          1792M   leaving ~2.2 GB for the host
#
# Without these limits a single memory spike (a large voucher PDF import) hands the
# choice of what to kill to the kernel OOM killer, and the kernel picks the largest
# RSS - usually Postgres. With them, the container that misbehaves is the container
# that dies, and `restart: unless-stopped` brings it straight back.
#
# If you resize the server, scale these proportionally. If a legitimate import starts
# getting killed, raise dotnet-backend first (check `docker inspect fuelflow-backend
# --format '{{.State.OOMKilled}}'` to confirm that is what happened).
#
# --- Log rotation --------------------------------------------------------------------
# Docker's default json-file driver has NO size cap: container logs grow until the
# 50 GB disk is full, at which point Postgres cannot write and the whole stack stops.
# 10 MB x 3 files per service bounds total log usage at ~150 MB.

name: fuelflow

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    container_name: fuelflow-caddy
    restart: unless-stopped
    mem_limit: 96m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # persists TLS certificates — do NOT delete
      - caddy_config:/config
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:?set MARKETING_DOMAIN in .env}
    depends_on:
      - dotnet-backend
      - admin-frontend
      - website-frontend

  dotnet-backend:
    build:
      context: ../backend
      dockerfile: src/FuelFlow.API/Dockerfile
    container_name: fuelflow-backend   # admin nginx proxies to this name — keep it as "dotnet-backend" service key
    restart: unless-stopped
    # Rendering a voucher PDF is the memory peak in this process. PdfRenderer caps a
    # rendered page at 4000px on its longest side and VouchersController serialises
    # imports to one at a time, so the peak is bounded — this limit is the backstop
    # for anything those two guards do not anticipate.
    mem_limit: 896m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # --- Database (the self-hosted postgres service below) ---
      # IMPORTANT: "SSL Mode=Disable" is REQUIRED for the local container connection.
      # If omitted, the app auto-appends "SSL Mode=Require" and will fail to connect.
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable;Trust Server Certificate=true"

      # --- Redis ---
      # Use the native StackExchange.Redis format, NOT a "redis://..." URI.
      # Program.cs parses URI-style values with an unguarded new Uri(), which throws if
      # the password contains "/" — and base64 passwords contain "/" about half the time.
      # Anything without "://" is passed straight through, so this form is always safe.
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"

      # --- Auth / JWT (must be >= 32 chars or the app refuses to start) ---
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      Jwt__Issuer: FuelFlow
      Jwt__Audience: FuelFlow
      Auth__DevBypass: "false"

      # --- SMS (SMS Club primary, Twilio fallback) — at least one must be configured or the ---
      # --- app refuses to start (silent FakeSmsService fallback, OTPs never delivered).  ---
      # Note: the app validates the provider's credentials on boot but NOT PhoneNumber —
      # a blank number boots fine and then fails when the first SMS is sent.
      SmsClub__Token: ${SMSCLUB_TOKEN:-}
      SmsClub__SenderName: ${SMSCLUB_SENDER_NAME:-}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__PhoneNumber: ${TWILIO_PHONE_NUMBER:-}

      # --- Monobank (LIVE payments) — app refuses to start if PublicKey is missing/placeholder ---
      Monobank__Enabled: "true"
      Monobank__BaseUrl: "https://api.monobank.ua"
      Monobank__Token: ${MONOBANK_TOKEN:?set MONOBANK_TOKEN in .env}
      Monobank__PublicKey: ${MONOBANK_PUBLIC_KEY:?set MONOBANK_PUBLIC_KEY in .env}
      Monobank__WebhookUrl: "https://${API_DOMAIN}/api/monobank/webhook"
      # :? guard on purpose. This is the URL Monobank sends the customer back to after
      # paying; an empty value silently produces a broken post-payment redirect on a
      # live payment, and the app does not validate it at boot.
      Monobank__RedirectUrl: ${MONOBANK_REDIRECT_URL:?set MONOBANK_REDIRECT_URL in .env (post-payment return URL, e.g. fuelflow://payment-result)}

      # --- Support form email (palne.shop/support -> palne.shopua@gmail.com) ---
      # Gmail SMTP requires an App Password (Google Account -> Security -> 2FA ->
      # App passwords); the regular account password is always rejected. When
      # SUPPORT_MAIL_USERNAME/PASSWORD are empty, delivery is disabled but
      # submissions are still persisted to the support_messages table.
      SupportMail__Host: ${SUPPORT_MAIL_HOST:-smtp.gmail.com}
      SupportMail__Port: "587"
      SupportMail__Username: ${SUPPORT_MAIL_USERNAME:-}
      SupportMail__Password: ${SUPPORT_MAIL_PASSWORD:-}
      SupportMail__ToEmail: ${SUPPORT_MAIL_TO_EMAIL:-}

      # --- Allowed hosts + CORS (admin is same-origin, so CORS is mostly a safety net) ---
      AllowedHosts: "${ROOT_DOMAIN};${API_DOMAIN};${MARKETING_DOMAIN}"
      Cors__AllowedOrigins__0: "https://${ROOT_DOMAIN}"
      # The palne.shop support form POSTs cross-origin to the API (the static
      # site has no server of its own). Without this origin the browser
      # preflight fails and every support submission dies before the API.
      Cors__AllowedOrigins__1: "https://${MARKETING_DOMAIN}"
      Cors__AllowedOrigins__2: "https://www.${MARKETING_DOMAIN}"

      # === DEVICE SIGNATURES ARE LEFT ON (this is correct) ==============================
      # The backend requires a signed request on /api/purchases and /api/purchases/bulk,
      # and the mobile app already signs both (mobile/src/core/api/apiClient.ts).
      # The old "deploy gated" warning was about OLD store installs from the retired
      # Render-era builds — it does not apply here, because current users install a
      # fresh build that signs.
      #
      # EMERGENCY SWITCH ONLY: if signing turns out to be broken on a real device and
      # checkout returns 401, uncomment the line below and redeploy. It disables the
      # anti-tamper check on the payment endpoints, so treat it as a short-lived hotfix.
      # (Overriding DeviceAuth__RequireSignatureForEndpoints__0/__1 does NOT work —
      #  .NET's config binder APPENDS to the list's C# defaults instead of replacing them.)
      # DeviceAuth__Enabled: "false"
      # ==================================================================================

      # TODO: remove once staging no longer tests against expired voucher stock.
      # Default true = fulfillment refuses expired vouchers (correct for production).
      # Set VOUCHER_EXPIRATION_ENABLED=false in .env only on a disposable/staging box.
      VoucherExpiration__Enabled: ${VOUCHER_EXPIRATION_ENABLED:-true}

      # Database migrations auto-apply on boot. Set to "false" to manage them manually.
      RunMigrationsOnBoot: "true"

      # --- Observability ------------------------------------------------------------------
      # Production pushes through an authenticated, push-only gateway. Loki itself is
      # isolated on the observability network and cannot be queried by app containers.
      Observability__Loki__Enabled: "true"
      Observability__Loki__Url: http://loki-gateway:8080
      Observability__Loki__Username: ${LOKI_PUSH_USERNAME:?set LOKI_PUSH_USERNAME in .env}
      Observability__Loki__Password: ${LOKI_PUSH_PASSWORD:?set LOKI_PUSH_PASSWORD in .env}

      # --- App Review / QA test phone (optional) ---------------------------------
      # Comma-separated phone=fixed-6-digit-code pairs, e.g.
      #   AUTH_TEST_PHONES=+380991234567=427135
      # Allowlisted numbers receive their fixed code at login and NO SMS is sent -
      # that is how Apple's reviewer signs in without a Ukrainian SIM. Set in
      # deploy/.env; empty disables the feature. The phone-number dictionary key
      # cannot be built through compose interpolation (keys are not interpolated),
      # so the pairs arrive as one raw string and the API parses it.
      Auth__TestPhoneRaw: ${AUTH_TEST_PHONES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-frontend:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: fuelflow-admin
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # No VITE_API_URL is passed on purpose: the SPA then calls a RELATIVE "/api",
    # which this container's nginx proxies to dotnet-backend:8080. Same-origin means
    # no CORS headaches and the refresh-token cookie stays first-party.
    depends_on:
      - dotnet-backend

  website-frontend:
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: fuelflow-website
    restart: unless-stopped
    mem_limit: 32m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Built from the repo's website/ (Next.js static export) on every deploy -
    # the marketing site is no longer a hand-copied directory on the host.

  postgres:
    image: postgres:16-alpine
    container_name: fuelflow-postgres
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — for backups / psql on the server, never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fuelflow-redis
    restart: unless-stopped
    mem_limit: 192m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # The password used to sit in `command:` as "--requirepass <secret>", which put it in
    # the redis-server process argv — readable by every local account via `ps aux` and
    # /proc, and printed by `docker inspect`. It is now written to a 0600 config file
    # inside the container instead, so argv carries only the config path.
    #
    # maxmemory-policy is deliberately `noeviction`, NOT allkeys-lru. Redis holds the
    # device-signature replay nonces (Middleware/DeviceSignatureMiddleware.cs:108-181)
    # and the device challenges. Under an LRU policy a full Redis would silently drop
    # nonce records and signed checkout requests would become replayable. With
    # noeviction, a write to a full Redis raises, RedisCacheService does not swallow it,
    # and the purchase fails closed — the correct direction for a money endpoint.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf 'requirepass %s\nmaxmemory 128mb\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    ports:
      - "127.0.0.1:6379:6379"   # localhost only
    healthcheck:
      # REDISCLI_AUTH instead of "-a <secret>" for the same argv reason as above.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
