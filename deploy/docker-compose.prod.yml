# FuelFlow — production stack for a single Hetzner server (CX22, 4 GB / 2 vCPU).
# Deploys happen automatically via CI (".github/workflows/ci.yml" → "Deploy to
# Hetzner"); this compose file is what CI builds and runs. Runbook:
# docs/DEPLOYMENT.md (private docs repo).
#
# Manual use (rollback / server restart):
#   cd ~/FuelFlow/deploy
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# Services (all on one private Docker network):
#   caddy          - the only thing exposed to the internet; automatic HTTPS + reverse proxy
#   dotnet-backend - the .NET 10 API (Hangfire background jobs run in-process; no separate worker)
#   admin-frontend - React admin SPA (nginx); also proxies /api -> backend, so it's same-origin
#   postgres       - self-hosted database; data lives in the named volume `postgres_data`
#   redis          - cache
#
# Postgres and Redis are bound to localhost only and never exposed to the internet.
#
# --- Memory limits -------------------------------------------------------------------
# Every service has a mem_limit. Sized for the Hetzner CX22 (4 GB RAM / 2 vCPU —
# originally deployed on a 2 GB server, docs/DEPLOYMENT.md (private docs repo)) with 2 GB of swap as
# the safety net:
#
#   dotnet-backend  896M   | postgres 512M | redis 192M | caddy 96M | admin 64M | website 32M
#   total          1792M   leaving ~2.2 GB for the host
#
# Without these limits a single memory spike (a large voucher PDF import) hands the
# choice of what to kill to the kernel OOM killer, and the kernel picks the largest
# RSS - usually Postgres. With them, the container that misbehaves is the container
# that dies, and `restart: unless-stopped` brings it straight back.
#
# If you resize the server, scale these proportionally. If a legitimate import starts
# getting killed, raise dotnet-backend first (check `docker inspect fuelflow-backend
# --format '{{.State.OOMKilled}}'` to confirm that is what happened).
#
# --- Log rotation --------------------------------------------------------------------
# Docker's default json-file driver has NO size cap: container logs grow until the
# 50 GB disk is full, at which point Postgres cannot write and the whole stack stops.
# 10 MB x 3 files per service bounds total log usage at ~150 MB.

name: fuelflow

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    container_name: fuelflow-caddy
    restart: unless-stopped
    mem_limit: 96m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # persists TLS certificates — do NOT delete
      - caddy_config:/config
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:?set MARKETING_DOMAIN in .env}

      # --- Staging vhosts (docker-compose.staging.yml) ---
      # This one Caddy also terminates TLS and reverse-proxies the staging.* domains,
      # reaching the staging containers over the shared `fuelflow_shared` network. Every
      # staging domain is gated by HTTP Basic auth (STAGING_BASICAUTH_*).
      #
      # No :? guards: left unset, the staging site blocks in the Caddyfile resolve to empty
      # addresses and `caddy validate` (run in the deploy before Caddy is recreated) fails
      # the deploy — prod's running Caddy is never touched. So an incomplete staging config
      # is loud and safe, not a prod outage. Set all of these together with the DNS records.
      STAGING_ROOT_DOMAIN: ${STAGING_ROOT_DOMAIN:-}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:-}
      STAGING_MARKETING_DOMAIN: ${STAGING_MARKETING_DOMAIN:-}
      STAGING_BASICAUTH_USER: ${STAGING_BASICAUTH_USER:-}
      # bcrypt hash from `caddy hash-password`. In .env every `$` MUST be doubled to `$$`
      # or compose eats it and the credential never matches (Caddy un-doubles on read).
      STAGING_BASICAUTH_HASH: ${STAGING_BASICAUTH_HASH:-}
    networks:
      # `default` = the prod project network (reaches dotnet-backend/admin/website as before).
      # `shared` = the external network the staging stack also joins, so this Caddy can reach
      # staging-admin / staging-backend / staging-website.
      default: {}
      shared: {}
    depends_on:
      - dotnet-backend
      - admin-frontend
      - website-frontend

  dotnet-backend:
    # Built in CI and pushed to GHCR (.github/workflows/ci.yml → "image-*"). The tag is
# per component — BACKEND_IMAGE_TAG / ADMIN_IMAGE_TAG / WEBSITE_IMAGE_TAG — so a
# component whose image failed to build keeps running its last good one instead of
# blocking the release. IMAGE_TAG sets all three at once for the documented manual
    # rollback path; the per-component variable wins where both are set. Everything
    # falls back to `main` (the tip) for manual `docker compose` runs. `build:` is
    # kept so a local/manual build still works and tags the same name — `docker
    # compose build` and `pull` are interchangeable here.
    image: ghcr.io/art-of-v/fuelflow-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-main}}
    build:
      context: ../backend
      dockerfile: src/FuelFlow.API/Dockerfile
    container_name: fuelflow-backend   # admin nginx proxies to this name — keep it as "dotnet-backend" service key
    restart: unless-stopped
    # Rendering a voucher PDF is the memory peak in this process. PdfRenderer caps a
    # rendered page at 4000px on its longest side and VouchersController serialises
    # imports to one at a time, so the peak is bounded — this limit is the backstop
    # for anything those two guards do not anticipate.
    mem_limit: 896m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # --- Database (the self-hosted postgres service below) ---
      # IMPORTANT: "SSL Mode=Disable" is REQUIRED for the local container connection.
      # If omitted, the app auto-appends "SSL Mode=Require" and will fail to connect.
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable;Trust Server Certificate=true"

      # --- Redis ---
      # Use the native StackExchange.Redis format, NOT a "redis://..." URI.
      # Program.cs parses URI-style values with an unguarded new Uri(), which throws if
      # the password contains "/" — and base64 passwords contain "/" about half the time.
      # Anything without "://" is passed straight through, so this form is always safe.
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"

      # --- Auth / JWT (must be >= 32 chars or the app refuses to start) ---
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      Jwt__Issuer: FuelFlow
      Jwt__Audience: FuelFlow
      Auth__DevBypass: "false"

      # --- ProductOwner bootstrap ---
      # The single ProductOwner is pinned here, NOT created through the app (the role is not
      # assignable via the admin panel by anyone). On boot the app promotes this phone to
      # ProductOwner if the account exists (idempotent; no-op once it already is). Leave blank
      # to skip. Format: full E.164, e.g. +380XXXXXXXXX.
      Auth__BootstrapProductOwnerPhone: ${BOOTSTRAP_PRODUCT_OWNER_PHONE:-}

      # --- QA App-Store test access ---
      # The QA verification code, treated as a production credential: hashed once at boot and
      # never logged or returned by any API. Leave blank to keep QA sign-in PERMANENTLY disabled
      # (fail-safe) regardless of the admin switch. Setting it only makes the code usable once an
      # admin ALSO turns "QA Test Access" ON in the admin panel; turning it off there revokes any
      # live QA session immediately. Rotate by changing the value and restarting the API.
      Auth__QaTestAccessCode: ${AUTH_QA_TEST_ACCESS_CODE:-}

      # --- SMS (SMS Club) — must be configured or the app refuses to start ---
      # --- (silent FakeSmsService fallback, OTPs never delivered).          ---
      # Note: the app validates Token + SenderName on boot; both must be non-empty.
      SmsClub__Token: ${SMSCLUB_TOKEN:-}
      SmsClub__SenderName: ${SMSCLUB_SENDER_NAME:-}

      # --- Monobank (LIVE payments) — app refuses to start if PublicKey is missing/placeholder ---
      Monobank__Enabled: "true"
      Monobank__BaseUrl: "https://api.monobank.ua"
      Monobank__Token: ${MONOBANK_TOKEN:?set MONOBANK_TOKEN in .env}
      Monobank__PublicKey: ${MONOBANK_PUBLIC_KEY:?set MONOBANK_PUBLIC_KEY in .env}
      # Second merchant, used only by QA accounts so they can exercise the payment path while
      # production takes real money (planning #212). Not required to boot: without it, QA accounts
      # are refused at checkout rather than silently charged on the live merchant.
      Monobank__SandboxToken: ${MONOBANK_SANDBOX_TOKEN:-}
      # Comma-separated E.164 numbers, NOT a list: the config binder cannot fill a list from a
      # single environment variable, and an allowlist that silently binds empty would route QA
      # accounts to the live merchant instead.
      Monobank__QaPhones: ${MONOBANK_QA_PHONES:-}
      Monobank__WebhookUrl: "https://${API_DOMAIN}/api/monobank/webhook"
      # :? guard on purpose. This is the URL Monobank sends the customer back to after
      # paying; an empty value silently produces a broken post-payment redirect on a
      # live payment, and the app does not validate it at boot.
      Monobank__RedirectUrl: ${MONOBANK_REDIRECT_URL:?set MONOBANK_REDIRECT_URL in .env (post-payment return URL, e.g. fuelflow://payment-result)}

      # --- Voucher QR encryption (AES-256, base64 or hex, exactly 32 bytes) ---
      # Encrypts fuel_vouchers.qr_payload at rest. Listed here explicitly because this file
      # enumerates every variable rather than passing .env through wholesale, so a value in .env
      # that nobody names below simply does not reach the container.
      # Losing this key loses every voucher QR permanently - the column no longer holds anything
      # the database can decrypt on its own.
      QrCipher__Key: ${QR_CIPHER_KEY:?set QR_CIPHER_KEY in .env (openssl rand -base64 32)}

      # --- Support form email (palne.shop/support -> palne.shopua@gmail.com) ---
      # Gmail SMTP requires an App Password (Google Account -> Security -> 2FA ->
      # App passwords); the regular account password is always rejected. When
      # SUPPORT_MAIL_USERNAME/PASSWORD are empty, delivery is disabled but
      # submissions are still persisted to the support_messages table.
      SupportMail__Host: ${SUPPORT_MAIL_HOST:-smtp.gmail.com}
      SupportMail__Port: "587"
      SupportMail__Username: ${SUPPORT_MAIL_USERNAME:-}
      SupportMail__Password: ${SUPPORT_MAIL_PASSWORD:-}
      SupportMail__ToEmail: ${SUPPORT_MAIL_TO_EMAIL:-}

      # --- Allowed hosts + CORS (admin is same-origin, so CORS is mostly a safety net) ---
      # `dotnet-backend` is the in-network service name Prometheus scrapes as
      # (http://dotnet-backend:8080/metrics). Without it, ASP.NET Core host
      # filtering rejects the scrape with 400 and every metric panel shows no data.
      # It is not publicly reachable — external traffic arrives via Caddy as the
      # public domains above.
      AllowedHosts: "${ROOT_DOMAIN};${API_DOMAIN};${MARKETING_DOMAIN};dotnet-backend"
      Cors__AllowedOrigins__0: "https://${ROOT_DOMAIN}"
      # The palne.shop support form POSTs cross-origin to the API (the static
      # site has no server of its own). Without this origin the browser
      # preflight fails and every support submission dies before the API.
      Cors__AllowedOrigins__1: "https://${MARKETING_DOMAIN}"
      Cors__AllowedOrigins__2: "https://www.${MARKETING_DOMAIN}"

      # === DEVICE SIGNATURES ARE LEFT ON (this is correct) ==============================
      # The backend requires a signed request on /api/purchases and /api/purchases/bulk,
      # and the mobile app already signs both (mobile/src/core/api/apiClient.ts).
      # The old "deploy gated" warning was about OLD store installs from the retired
      # Render-era builds — it does not apply here, because current users install a
      # fresh build that signs.
      #
      # EMERGENCY SWITCH ONLY: if signing turns out to be broken on a real device and
      # checkout returns 401, uncomment the line below and redeploy. It disables the
      # anti-tamper check on the payment endpoints, so treat it as a short-lived hotfix.
      # (Overriding DeviceAuth__RequireSignatureForEndpoints__0/__1 does NOT work —
      #  .NET's config binder APPENDS to the list's C# defaults instead of replacing them.)
      # DeviceAuth__Enabled: "false"
      # ==================================================================================

      # TODO: remove once staging no longer tests against expired voucher stock.
      # Default true = fulfillment refuses expired vouchers (correct for production).
      # Set VOUCHER_EXPIRATION_ENABLED=false in .env only on a disposable/staging box.
      VoucherExpiration__Enabled: ${VOUCHER_EXPIRATION_ENABLED:-true}

      # --- OKKO pump-price sync (Hangfire, every 15 minutes) ---
      # Pulls the current pump price from https://www.okko.ua/api/uk/fuels and reprices
      # FinalPricePerLiter / OriginalPrice. SupplierPricePerLiter is deliberately NOT
      # touched - a pump change is not a cost event, and the supplier cost is what the
      # merchant actually paid and is entered by hand.
      # Off by default: enabling it makes customer-facing prices follow the site daily,
      # and any fuel whose pump price sits below the recorded supplier cost becomes
      # unsellable (the below-cost guard at checkout). Opt in per environment via
      # OKKO_PRICE_ENABLED=true in deploy/.env.
      OkkoPrice__Enabled: ${OKKO_PRICE_ENABLED:-false}
      OkkoPrice__EndpointUrl: ${OKKO_PRICE_ENDPOINT:-https://www.okko.ua/api/uk/fuels}
      OkkoPrice__TimeoutSeconds: ${OKKO_PRICE_TIMEOUT_SECONDS:-30}

      # UPG and WOG publish their price list as a page, not an API, so the sheet is read by the
      # backend itself - the same job, the same cadence, and the same failure policy: a page that
      # cannot be read leaves the last known prices alone. The catalogue half of these jobs runs
      # weekly, so a new grade appears on the week, not the quarter.
      UpgWogPrice__Enabled: ${UPGWOG_PRICE_ENABLED:-false}
      UpgWogPrice__UpgEndpointUrl: ${UPGWOG_PRICE_UPG_ENDPOINT:-https://upg.ua/}
      UpgWogPrice__WogEndpointUrl: ${UPGWOG_PRICE_WOG_ENDPOINT:-https://www.wog.ua/ua/fuels/}
      UpgWogPrice__TimeoutSeconds: ${UPGWOG_PRICE_TIMEOUT_SECONDS:-30}

      # KLO publishes no prices of its own - its products page lists the grades and nothing else -
      # so Minfin's table is the source: the average retail price of every network, KLO included.
      # Its five grades are the five our KLO catalogue holds, so a grade read from here matches a
      # fuel without a second table of correspondences.
      MinfinPrice__Enabled: ${MINFIN_PRICE_ENABLED:-false}
      MinfinPrice__EndpointUrl: ${MINFIN_PRICE_ENDPOINT:-https://index.minfin.com.ua/ua/markets/fuel/tm/}
      MinfinPrice__TimeoutSeconds: ${MINFIN_PRICE_TIMEOUT_SECONDS:-30}

      # Database migrations auto-apply on boot. Set to "false" to manage them manually.
      RunMigrationsOnBoot: "true"

      # --- Observability ------------------------------------------------------------------
      # Production pushes through an authenticated, push-only gateway. Loki itself is
      # isolated on the observability network and cannot be queried by app containers.
      Observability__Loki__Enabled: "true"
      Observability__Loki__Url: http://loki-gateway:8080
      Observability__Loki__Username: ${LOKI_PUSH_USERNAME:?set LOKI_PUSH_USERNAME in .env}
      Observability__Loki__Password: ${LOKI_PUSH_PASSWORD:?set LOKI_PUSH_PASSWORD in .env}
      # Sentry error tracking. Optional: leave SENTRY_DSN unset in .env and the SDK is
      # never initialised (the app sends nothing to Sentry). Set it to the project DSN
      # to turn error reporting on — no redeploy of anything else needed.
      Observability__Sentry__Dsn: ${SENTRY_DSN:-}

      # --- Telegram (staff alerts the API raises itself) -----------------------------------
      # Reuses the infra bot already configured for Grafana (TELEGRAM_BOT_TOKEN /
      # TELEGRAM_CHAT_ID in deploy/.env), so no new secret is introduced. Which events
      # actually fire is decided by the per-event toggles in appsettings.Production.json
      # (currently: import errors + paid-order-unfulfillable). If either var is unset the
      # token/chat is empty, IsConfigured is false, and every alert is a silent no-op.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatIds__0: ${TELEGRAM_CHAT_ID:-}

      # --- Feedback bot (in-app Telegram feedback channel, optional) ----------------------
      # A SEPARATE bot token from the alerting one above: Telegram allows one webhook per
      # token, so sharing them would mean routing both by update type at one endpoint and
      # letting feedback traffic interfere with alerting.
      # Unset => IsConfigured is false, the webhook 401s every delivery, and the mobile tab
      # stays hidden whatever the app_setting says - the deep-link endpoint needs both. The
      # admin Settings screen reports the two halves separately ("Telegram configured" vs the
      # toggle), so a half-configured channel reads as broken instead of half-working. The
      # webhook itself is registered from there, per deploy, or after a domain change.
      Telegram__Feedback__Enabled: ${TELEGRAM_FEEDBACK_ENABLED:-false}
      Telegram__Feedback__BotToken: ${TELEGRAM_FEEDBACK_BOT_TOKEN:-}
      Telegram__Feedback__BotUsername: ${TELEGRAM_FEEDBACK_BOT_USERNAME:-}
      Telegram__Feedback__WebhookSecret: ${TELEGRAM_FEEDBACK_WEBHOOK_SECRET:-}
      Telegram__Feedback__SigningKey: ${TELEGRAM_FEEDBACK_SIGNING_KEY:-}
      Telegram__Feedback__StaffChatId: ${TELEGRAM_FEEDBACK_STAFF_CHAT_ID:-0}
      Telegram__Feedback__StaffUserIds__0: ${TELEGRAM_FEEDBACK_STAFF_USER_IDS:-}

      # --- Settlement bot (closed channel finance declares arriving money in, optional) -----
      # A THIRD bot token: Telegram allows exactly one webhook per token, so the alerting bot
      # and the feedback bot cannot share this endpoint without letting unrelated traffic reach
      # the handler that creates payments.
      # Register the webhook ONLY after this deploy is live, otherwise Telegram retries a 404
      # forever:  curl "https://api.telegram.org/bot<TOKEN>/setWebhook" \
      #            -d url=https://api.palne.shop/api/telegram/settlement/webhook \
      #            -d secret_token=<TELEGRAM_SETTLEMENT_WEBHOOK_SECRET> -d allowed_updates='["message"]'
      # The endpoint lives on API_DOMAIN, not ROOT_DOMAIN: the admin domain proxies only an
      # allow-list of /api paths and answers 404 for everything else.
      # AllowedChatId is NEGATIVE for a group (-100... or the newer -5... form). AllowedUserIds
      # is the actual security boundary - the secret only proves Telegram sent the delivery - so
      # it is part of IsConfigured: empty means every delivery is rejected, never every accepted.
      Telegram__Settlement__Enabled: ${TELEGRAM_SETTLEMENT_ENABLED:-false}
      Telegram__Settlement__BotToken: ${TELEGRAM_SETTLEMENT_BOT_TOKEN:-}
      Telegram__Settlement__WebhookSecret: ${TELEGRAM_SETTLEMENT_WEBHOOK_SECRET:-}
      Telegram__Settlement__AllowedChatId: ${TELEGRAM_SETTLEMENT_CHAT_ID:-0}
      Telegram__Settlement__AllowedUserIds__0: ${TELEGRAM_SETTLEMENT_ALLOWED_USER_IDS:-}

      # --- Feedback triage classifier (optional) -------------------------------------------
      # Unset => IsConfigured is false, and every message is stored and shown unfiltered
      # rather than lost. The LLM is a filter, not a gate.
      Llm__Enabled: ${LLM_ENABLED:-false}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__Model: ${LLM_MODEL:-gemini-2.0-flash}

      # --- Over-the-air JS updates (self-hosted Expo Updates, planning #42) -----------------
      # Public, CDN-fronted base URL of the R2 bucket holding the pre-signed update descriptors
      # + assets. The API only fetches and relays already-signed bytes; the private signing key
      # never touches the server. Leave OTA_PUBLIC_BASE_URL unset in .env and
      # /api/updates/manifest answers 204 (no update) — the feature stays inert, so an
      # unconfigured deploy never breaks an installed app.
      Updates__PublicBaseUrl: ${OTA_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-frontend:
    image: ghcr.io/art-of-v/fuelflow-admin:${ADMIN_IMAGE_TAG:-${IMAGE_TAG:-main}}
    build:
      context: ../admin
      dockerfile: Dockerfile
      # Baked into the static bundle at build time (the admin has no runtime env — it's
      # nginx serving files). Empty by default = Sentry stays off. This is a SEPARATE DSN
      # from the backend's SENTRY_DSN (a different Sentry project: browser JS vs .NET).
      args:
        VITE_SENTRY_DSN: ${ADMIN_SENTRY_DSN:-}
    container_name: fuelflow-admin
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # No VITE_API_URL is passed on purpose: the SPA then calls a RELATIVE "/api",
    # which this container's nginx proxies to dotnet-backend:8080. Same-origin means
    # no CORS headaches and the refresh-token cookie stays first-party.
    depends_on:
      - dotnet-backend

  website-frontend:
    image: ghcr.io/art-of-v/fuelflow-website:${WEBSITE_IMAGE_TAG:-${IMAGE_TAG:-main}}
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: fuelflow-website
    restart: unless-stopped
    mem_limit: 32m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Built from the repo's website/ (Next.js static export) on every deploy -
    # the marketing site is no longer a hand-copied directory on the host.

  postgres:
    image: postgres:16-alpine
    container_name: fuelflow-postgres
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The cluster's collation, decided at initdb time and not changeable afterwards:
      # PostgreSQL 16 cannot ALTER DATABASE ... LC_COLLATE.
      #
      # The Alpine image ships no usable system locale - initdb logs "no usable system locales
      # were found" and silently falls back to en_US.utf8, whose collation defines no ordering
      # for Cyrillic, so strings compare by code point. Measured 2026-10-19:
      #
      #   en_US.utf8   Є І Ї А Б В Г Д Е Ж З И Й ... Я Ґ     <- not the Ukrainian alphabet
      #   uk-UA (ICU) А Б В Г Ґ Д Е Є Ж З И І Ї Й ... Я
      #
      # ICU rather than a glibc locale, because "uk-UA.utf8" cannot be generated on this image
      # at all - the locale command is not present. ICU is compiled into the server and needs no
      # OS locale; C.UTF-8 stays the libc default for the categories ICU does not govern.
      #
      # This only takes effect when initdb runs, i.e. on an empty volume. The cluster that
      # exists today was created without it; deploy/rebuild-collation.sh is what changes that.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=uk-UA --locale=C.UTF-8 --data-checksums"
    # Postgres tuning and query visibility. Measured on this box 2026-10-19 and left as it was found:
    #
    #   effective_cache_size  was 4 GB on a 512 MB container (and a 4 GB host). The planner reads
    #                          this as "assume the whole box is cache", which is how a seq scan on a
    #                          30 MB database starts costing index scans it cannot afford. 1 GB is
    #                          what this host can actually hold for Postgres.
    #   shared_preload_libraries  empty, so there was no query-level visibility at all: Prometheus
    #                          and Grafana watched the container and nothing inside it. This is the
    #                          cheapest possible way to see which statements the storefront runs.
    #   log_min_duration_statement  -1, i.e. off. One second is pathological for this workload and
    #                          costs nothing while it stays pathological.
    #   track_io_timing      off, which makes EXPLAIN's I/O timings unavailable when they are
    #                          exactly the thing worth explaining.
    #
    # pg_stat_statements itself is created by a migration rather than an initdb script, so every
    # environment gets it and a missing one fails loudly instead of silently going without.
    #
    # THE PLANNER, 2026-10-20. The two cost constants were PostgreSQL's defaults, and those
    # defaults are for a magnetic spindle:
    #
    #   random_page_cost 4        the default. It tells the planner a random read costs four
    #                               times what a sequential one does. The disk is an SSD (lsblk
    #                               reports ROTA 0), where it costs about the same, so the
    #                               planner was told index scans are four times more expensive
    #                               than they are - and answered "sequential scan" for years.
    #   effective_io_concurrency 1
    #                               the default: one outstanding read at a time. An SSD can have
    #                               dozens, and this is what decides whether the planner believes
    #                               a bitmap heap scan is viable at all.
    #
    # THE TIMEOUTS, 2026-10-20. All three were 0, i.e. unbounded:
    #
    #   statement_timeout 30s          one bad query holds a connection and a snapshot for as
    #                                   long as it likes.
    #   lock_timeout 10s               a statement that waits for a lock fails fast and is
    #                                   retried, rather than sitting in the queue holding the
    #                                   lock it is waiting for.
    #   idle_in_transaction_session_timeout 60s
    #                                   THE IMPORTANT ONE. A connection that opens a transaction
    #                                   and walks away holds its snapshot, and that is what pins
    #                                   the vacuum horizon and stops VACUUM from reclaiming
    #                                   dead rows ANYWHERE in the database. The application opens
    #                                   explicit transactions in eight places in FulfillmentService
    #                                   alone, so a leaked one is a matter of time.
    #
    # THE LOGS, 2026-10-20. Three settings that cost nothing and say what used to be invisible:
    # a query that spills to disk (log_temp_files), a lock wait (log_lock_waits), and an
    # autovacuum that ran for two minutes and changed the plan underneath a query
    # (log_autovacuum_min_duration, which was 10 minutes - i.e. off in practice).
    #
    # AND THE TWO THAT NEED A RESTART, which is why they are here rather than in the file
    # the settings above came from: shared_buffers 256M (128M was the PostgreSQL default, not a
    # choice, and a quarter of a 512M container belongs to the buffer cache) and
    # max_connections 50 (100 on a 512M container is generous; the application's pool is
    # capped at 5, so this is insurance against a connection storm).
    #
    # WHY THEY ARE IN THE COMPOSE FILE AND NOT ONLY ON THE BOX. They were applied to the
    # running server with ALTER SYSTEM, which writes postgresql.auto.conf - and that file lives
    # in the container's volume. A box rebuilt from the compose file, or a disaster recovery on
    # a new server, would come up with PostgreSQL's DEFAULTS, and every one of these would
    # silently be back to what it was. A setting that only exists on one machine is not a
    # setting; it is an incident waiting for a rebuild.
    #
    #   effective_cache_size  was 4 GB on a 512 MB container (and a 4 GB host). The planner reads
    #                          this as "assume the whole box is cache", which is how a seq scan on a
    #                          30 MB database starts costing index scans it cannot afford. 1 GB is
    #                          what this host can actually hold for Postgres.
    #   shared_preload_libraries  empty, so there was no query-level visibility at all: Prometheus
    #                          and Grafana watched the container and nothing inside it. This is the
    #                          cheapest possible way to see which statements the storefront runs.
    #   log_min_duration_statement  -1, i.e. off. One second is pathological for this workload and
    #                          costs nothing while it stays pathological.
    #   track_io_timing      off, which makes EXPLAIN's I/O timings unavailable when they are
    #                          exactly the thing worth explaining.
    #
    # pg_stat_statements itself is created by a migration rather than an initdb script, so every
    # environment gets it and a missing one fails loudly instead of silently going without.
    command:
      - postgres
      - -c
      - effective_cache_size=1GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      - -c
      - track_io_timing=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - statement_timeout=30s
      - -c
      - lock_timeout=10s
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_temp_files=10MB
      - -c
      - log_lock_waits=on
      - -c
      - log_autovacuum_min_duration=1000
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      # WAL archiving, which is what turns the nightly dump into a recoverable history.
      #
      # The dump alone is a snapshot at 03:23. Everything that happened between the previous
      # snapshot and it is gone, so the RPO is a full day - and this is a payment system, where
      # a day of orders is a day of money. With archiving on, the write-ahead log is copied off
      # the server as it fills, and a restore can replay it to any point in time.
      #
      # archive_timeout is the part that matters here and is the part that is usually forgotten:
      # without it, a quiet database archives nothing, and the archive has a hole exactly when
      # nothing is happening - which is when you would want to restore to. It bounds the gap in
      # a quiet system to the timeout.
      #
      # It is FIFTEEN minutes, not five, and that number is a disk decision as much as a
      # recovery one. An idle database produces one 16 MiB segment per timeout, and almost all
      # of it is zeros, so the rate is set by the TIMEOUT and not by the traffic. Measured on
      # this box on 2026-10-19: five minutes gave 288 segments a day, 4.6 GiB a day - which a
      # 21 GiB disk holds for four days. Fifteen minutes gives 1.5 GiB a day, and the
      # recovery point objective is still fifteen minutes on a quiet system, which is a
      # fraction of what the dump's daily snapshot costs.
      # The command is idempotent and refuses to overwrite: PostgreSQL will not archive the same
      # segment twice, and a segment that is already there means the copy succeeded.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal/%f && cp %p /var/lib/postgresql/wal/%f
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The archive lives on the HOST, not inside the container's data volume, for two reasons.
      # A container that is recreated takes its data volume with it but not a bind mount's
      # contents - and the archive has to survive exactly that. And the backup script ships it
      # off-box with rclone, which is easier from the host than from inside a container.
      #
      # The path is written out rather than taken from the environment, on purpose. The compose
      # parse gate resolves every variable the file references against a dummy value, and a
      # dummy value is not a path - it would be read as the NAME of a volume that does not
      # exist, and the whole file would fail to load before a single container was touched.
      # The path is therefore literal, and it has to match the one in deploy/backup.sh and
      # deploy/enable-pitr.sh.
      - /root/fuelflow-wal:/var/lib/postgresql/wal
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — for backups / psql on the server, never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fuelflow-redis
    restart: unless-stopped
    mem_limit: 192m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # The password used to sit in `command:` as "--requirepass <secret>", which put it in
    # the redis-server process argv — readable by every local account via `ps aux` and
    # /proc, and printed by `docker inspect`. It is now written to a 0600 config file
    # inside the container instead, so argv carries only the config path.
    #
    # maxmemory-policy is deliberately `noeviction`, NOT allkeys-lru. Redis holds the
    # device-signature replay nonces (Middleware/DeviceSignatureMiddleware.cs:108-181)
    # and the device challenges. Under an LRU policy a full Redis would silently drop
    # nonce records and signed checkout requests would become replayable. With
    # noeviction, a write to a full Redis raises, RedisCacheService does not swallow it,
    # and the purchase fails closed — the correct direction for a money endpoint.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        printf 'requirepass %s\nmaxmemory 128mb\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    ports:
      - "127.0.0.1:6379:6379"   # localhost only
    healthcheck:
      # REDISCLI_AUTH instead of "-a <secret>" for the same argv reason as above.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  # The prod project network. All prod services attach to it implicitly; only caddy
  # additionally joins `shared` below.
  default:
  # Shared with the staging stack (docker-compose.staging.yml) so the prod caddy can
  # reverse-proxy the staging.* domains to the staging containers. Create it once on the
  # box:  docker network create fuelflow_shared
  shared:
    external: true
    name: fuelflow_shared

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
