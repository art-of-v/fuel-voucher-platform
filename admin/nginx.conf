# nginx for the admin SPA container. Copied to /etc/nginx/conf.d/default.conf, which is
# included inside nginx's `http` block - so the `map` below is in a valid context.
#
# Security headers are set once at the edge in deploy/Caddyfile so the two configs cannot
# drift. Caddy's `header` directive replaces, so anything set here would be overwritten
# anyway. This file is only responsible for serving the bundle and for the same-origin
# /api proxy.

# Which /api paths this container is willing to forward to the backend.
#
# The proxy below used to forward ALL of /api/, which republished the entire money API -
# Monobank webhook, device-signed mobile checkout, every mobile endpoint - on the admin
# domain as a second public front door. This list is the admin SPA's actual surface,
# taken from its own source. Anything not listed answers 404 here and never reaches the
# backend.
#
# Caddy applies the same allow-list at the edge (deploy/Caddyfile). This copy is the
# defence-in-depth layer: if the edge config is ever changed or replaced, the second
# front door does not silently reopen.
#
# Adding an admin feature that calls a new endpoint? Add it here AND in the Caddyfile.
map $uri $fuelflow_api_allowed {
    default                      0;
    ~^/api/admin(/.*)?$          1;
    /api/auth/refresh            1;
    /api/auth/refresh/logout     1;
    /api/auth/send-code          1;
    /api/auth/verify             1;
    /api/auth/user/me            1;
    /api/voucher-catalog/import  1;
}

server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't disclose the nginx version in responses or error pages.
    server_tokens off;

    # Handle SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        # One of the two uses of `if` that nginx documents as safe in a location.
        if ($fuelflow_api_allowed = 0) {
            return 404;
        }

        proxy_pass http://dotnet-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # The voucher PDF import posts a multipart body up to 25 MB
        # (RequestSizeLimit on VouchersController.ImportVouchers). nginx's default
        # client_max_body_size is 1 MB, which would reject it here with a 413 before
        # the backend ever saw it.
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # NOTE: a /uploads/ proxy used to live here. The backend serves nothing at /uploads -
    # there is no static-files middleware and no such controller - so it was a dead route
    # pointing at the API. Removed rather than left as a decoy.

    # Handle static assets with revalidation
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
}
