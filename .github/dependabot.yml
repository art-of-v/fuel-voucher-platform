# Dependabot reads ONLY this file (.github/dependabot.yml on the default branch).
# The former backend/.github/dependabot.yml was never evaluated by GitHub; its
# nuget/github-actions configuration is consolidated here.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps):"
    groups:
      dotnet-core:
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "AspNetCore.*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "xunit*"
          - "Moq*"
          - "FluentAssertions*"
          - "coverlet*"
        update-types:
          - "minor"
          - "patch"
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore*"
        update-types:
          - "minor"
          - "patch"
      pdf:
        patterns:
          - "Docnet*"
          - "UglyToad.PdfPig*"
        update-types:
          - "minor"
          - "patch"
      imaging:
        patterns:
          - "SixLabors.ImageSharp*"
          - "ZXing*"
        update-types:
          - "minor"
          - "patch"

  # P3 hygiene (docs/SECURITY_AUDIT_2026-08-21.md): dependabot coverage for the npm projects.
  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps):"
    groups:
      admin-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps):"
    groups:
      mobile-minor-patch:
        exclude-patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
