# Dependabot reads ONLY this file (.github/dependabot.yml on the default branch).
# The former backend/.github/dependabot.yml was never evaluated by GitHub; its
# nuget/github-actions configuration is consolidated here.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps):"
    groups:
      dotnet-core:
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "AspNetCore.*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "xunit*"
          - "Moq*"
          - "FluentAssertions*"
          - "coverlet*"
        update-types:
          - "minor"
          - "patch"
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore*"
        update-types:
          - "minor"
          - "patch"
      pdf:
        patterns:
          - "Docnet*"
          - "UglyToad.PdfPig*"
        update-types:
          - "minor"
          - "patch"
      imaging:
        patterns:
          - "SixLabors.ImageSharp*"
          - "ZXing*"
        update-types:
          - "minor"
          - "patch"

  # Deferred majors get ignore rules instead of ever-growing PR graveyards.
  # Each entry below corresponds to a closed PR whose comment records WHY the
  # major is deferred and what a deliberate upgrade requires. Remove an ignore
  # rule when scheduling that migration so Dependabot re-proposes it once.
    ignore:
      - dependency-name: "SixLabors.ImageSharp*"   # v3+ license change; needs review
        update-types: ["version-update:semver-major"]
      - dependency-name: "Net.Codecrete.QrCodeGenerator*"  # API breaks in 3.x
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.OpenApi*"       # Swashbuckle compat pass first
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "coverlet.collector"
        update-types: ["version-update:semver-major"]

  # P3 hygiene (docs/SECURITY_AUDIT_2026-08-21.md): dependabot coverage for the npm projects.
  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps):"
    groups:
      admin-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"              # TS7 migration needs its own window
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps):"
    groups:
      mobile-minor-patch:
        exclude-patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "expo*"                   # SDK family upgrades together only
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"             # nativewind v4 targets Tailwind 3
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
