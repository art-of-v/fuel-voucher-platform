name: Secret scan

# Fails the build if a hardcoded secret (API key, token, private key, connection string
# with credentials, etc.) is present anywhere in the tracked working tree. Complements the
# injected-payload scan (security-scan.yml): that one looks for one specific known-bad
# pattern; this one is a general credential scanner (gitleaks).
#
# WHY THIS EXISTS: this repo has already had a real secret-exposure incident that required
# token rotation. A committed credential in a PUBLIC repo is compromised the instant it
# lands — GitHub is continuously scraped — so the only useful place to catch it is BEFORE
# merge. main is branch-protected to require this check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned release (gitleaks 8.30.1, linux x64) by asset id + checksum. Same supply-chain
  # reasoning as the SHA-pinned actions in ci.yml: a floating "latest" is a mutable pointer
  # someone else controls, and this binary runs in a job that has the repo checked out. The
  # checksum makes the download tamper-evident; the asset id is immutable too.
  #
  # The id is used instead of the /releases/download/ URL because that host answers 504 to
  # runner egress for minutes at a time (2026-11-08: six consecutive runs failed before the
  # scan started), while the API asset endpoint kept serving. A scan that cannot download is
  # a red build that says nothing about the code.
  GITLEAKS_ASSET_ID: "378332058"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          # Raises the API rate limit; the token never decides what is run — the checksum does.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Retries cover the same storage host's transient 5xx: a 4-second red build over a
          # network read is worse than a ten-second wait.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_ASSET_ID}" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan working tree
        run: |
          set -euo pipefail
          # `dir` scans the files in the checkout (not git history), so it gates on
          # "is there a secret in the code as it would merge". --redact ensures a finding
          # is reported by rule + location, never by printing the secret value into the log.
          ./gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
