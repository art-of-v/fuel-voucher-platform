name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer: whoever can push to the action's repository can move v7 to different code, and
# every workflow that references v7 executes it on the next run with this repo checked out
# and the job's token in the environment. The trailing comment records which release each
# SHA was, so upgrades stay reviewable.

jobs:
  # Change detector — the cost gate for a PRIVATE repo. On a private repo every GitHub-hosted
  # job-minute is billed and rounded UP per job, so a job that only spins up (checkout +
  # toolchain) to then skip its work still bills ~a minute. The win is therefore to skip the
  # WHOLE job, not just its steps: a job never entered by its `if:` bills zero. Each matrix job
  # below gates its entire self on this detector's output, so an unrelated PR runs only this
  # detector plus the aggregator and bills almost nothing.
  #
  # The always-run `ci-required` aggregator (bottom of the matrix) is what makes full-job
  # skipping safe under branch protection: it is the SOLE required status check, so a skipped
  # matrix job never leaves a required context unreported — the deadlock that job-skipping
  # would otherwise cause on `enforce_admins` main.
  #
  # Pure `git diff` — deliberately NOT a third-party action (dorny/paths-filter et al.), so
  # the CI supply-chain surface is unchanged on a money repo that SHA-pins everything.
  # Fails OPEN: if the base commit or the diff is unavailable, every component is marked
  # changed so nothing is silently skipped. Any change OUTSIDE the four app dirs (repo-root
  # files, deploy/, docs/, .github/**) also runs everything — a shared or CI change can affect
  # any component, so the safe default there is the full matrix.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        run: |
          set -euo pipefail
          allchanged=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — running all suites."
            allchanged=1; changed=""
          else
            changed="$(git diff --name-only "$base" "${{ github.sha }}")" || { echo "diff failed — running all suites."; allchanged=1; changed=""; }
          fi
          echo "Changed files:"; echo "$changed"
          backend=false; admin=false; mobile=false; website=false; other=false
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            case "$f" in
              backend/*) backend=true ;;
              admin/*)   admin=true ;;
              mobile/*)  mobile=true ;;
              website/*) website=true ;;
              *)         other=true ;;
            esac
          done <<< "$changed"
          # A change to shared/root/CI/deploy files, or an unreadable diff, exercises everything.
          if [ "$allchanged" = "1" ] || [ "$other" = "true" ]; then
            backend=true; admin=true; mobile=true; website=true
          fi
          for kv in "backend=$backend" "admin=$admin" "mobile=$mobile" "website=$website"; do
            echo "$kv" >> "$GITHUB_OUTPUT"; echo "$kv"
          done

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache the global NuGet package store between runs. This repo has no lock files or a
      # central Directory.Packages.props, so versions live in the .csproj files — key on the
      # union of them. The same key warms the backend-integration job below.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restore every project ONCE here; Build / scan / unit-test steps below all run
      # --no-restore, so the restore graph is computed a single time instead of being
      # repeated by each of them (the scan used to re-restore all six on its own). The
      # project list is explicit rather than the .slnx for the same reason the scan lists
      # them: the .slnx omits FuelFlow.Providers.UnitTests, which CI still builds and tests.
      - name: Restore
        run: |
          set -euo pipefail
          projects=(
            src/FuelFlow.API/FuelFlow.API.csproj
            src/FuelFlow.JobsWorker/FuelFlow.JobsWorker.csproj
            tests/FuelFlow.UnitTests/FuelFlow.UnitTests.csproj
            tests/FuelFlow.JobsWorker.UnitTests/FuelFlow.JobsWorker.UnitTests.csproj
            tests/FuelFlow.Providers.UnitTests/FuelFlow.Providers.UnitTests.csproj
            tests/FuelFlow.IntegrationTests/FuelFlow.IntegrationTests.csproj
          )
          for proj in "${projects[@]}"; do dotnet restore "$proj"; done

      - name: Build API
        run: dotnet build src/FuelFlow.API/FuelFlow.API.csproj --no-restore

      # Fail the build on any known-vulnerable NuGet package, transitive included. This is
      # the gate that would have caught the Hangfire.Core -> Newtonsoft.Json 11.0.1 advisory
      # (GHSA-5crp-9r3c-p9vr) on the PR that introduced it, instead of a later audit.
      #
      # Two quirks force the shape of this step:
      #   * `dotnet list package --vulnerable` exits 0 even when it finds advisories, so the
      #     exit code is useless as a gate — we scan its OUTPUT for the finding marker instead.
      #   * --include-transitive is mandatory: the advisory that prompted this was purely
      #     transitive (nothing referenced Newtonsoft directly), so a direct-only scan is blind.
      # Every project is listed explicitly rather than via FuelFlow.slnx because the .slnx omits
      # FuelFlow.Providers.UnitTests (which CI still builds and tests), and the test projects
      # inherit the production transitive graph through their ProjectReferences.
      - name: Vulnerable dependency scan
        run: |
          set -euo pipefail
          projects=(
            src/FuelFlow.API/FuelFlow.API.csproj
            src/FuelFlow.JobsWorker/FuelFlow.JobsWorker.csproj
            tests/FuelFlow.UnitTests/FuelFlow.UnitTests.csproj
            tests/FuelFlow.JobsWorker.UnitTests/FuelFlow.JobsWorker.UnitTests.csproj
            tests/FuelFlow.Providers.UnitTests/FuelFlow.Providers.UnitTests.csproj
            tests/FuelFlow.IntegrationTests/FuelFlow.IntegrationTests.csproj
          )
          report="$(mktemp)"
          for proj in "${projects[@]}"; do
            echo "== $proj =="
            dotnet list "$proj" package --vulnerable --include-transitive | tee -a "$report"
          done
          if grep -Eiq "has the following vulnerable packages" "$report"; then
            echo "::error::Vulnerable NuGet packages detected — see the scan output above."
            exit 1
          fi
          echo "No vulnerable packages found."

      # Fast, hermetic tests (in-memory EF, no external services). The Docker-backed
      # integration suite runs in its own job below so a Postgres pull never slows this down.
      - name: Unit tests
        run: |
          dotnet test tests/FuelFlow.UnitTests/FuelFlow.UnitTests.csproj --configuration Release --no-restore
          dotnet test tests/FuelFlow.JobsWorker.UnitTests/FuelFlow.JobsWorker.UnitTests.csproj --configuration Release --no-restore
          dotnet test tests/FuelFlow.Providers.UnitTests/FuelFlow.Providers.UnitTests.csproj --configuration Release --no-restore

  backend-integration:
    name: Backend integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The heaviest job in the matrix: Testcontainers spins up Postgres via the Docker daemon
      # preinstalled on GitHub-hosted ubuntu runners. The whole job is gated (job-level `if:`
      # above), so on an unrelated PR it never starts and bills zero minutes; on any push to
      # main it always runs, so the commit that actually deploys is re-tested in full.
      - name: Integration tests
        run: dotnet test tests/FuelFlow.IntegrationTests/FuelFlow.IntegrationTests.csproj --configuration Release

  admin:
    name: Admin (Vite React)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Expo RN)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The whole job is gated (job-level `if:` above): it runs only when mobile/** changed,
      # or on any push to main. The app is pure frontend with no build-time contract shared
      # with the backend, so skipping it on an unrelated PR cannot mask a cross-side break.
      - name: Install
        run: npm ci

      # FF-03 hard gate: an enabled OTA update channel (expo.updates.enabled != false with a
      # url set) MUST ship a code-signing certificate, or the client accepts any manifest the
      # channel serves — arbitrary code on every install, checkout/payment screens included.
      # No FUELFLOW_ACK_UNSIGNED_OTA is set here on purpose: signing is now in place, so this
      # is a real gate, not an acknowledged warning. See mobile/scripts/check-update-signing.mjs
      # and art-of-v/fuel-voucher-platform-planning#42.
      - name: OTA update signing gate (FF-03)
        run: npm run check:ota-signing

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  website:
    name: Website (Next.js static)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # The SINGLE required status check on branch-protected main. Every matrix job above can be
  # fully skipped on an unrelated PR (that is the private-repo cost win) — but a skipped job
  # reports NO status, so if the matrix jobs themselves were the required contexts, branch
  # protection would wait forever for a context that never arrives (with strict + enforce_admins
  # the PR is then unmergeable). This always-run job depends on all of them and collapses their
  # results into one: it passes when each dependency SUCCEEDED or was SKIPPED, and fails only if
  # any genuinely FAILED or was CANCELLED. It stays on a hosted runner (not the self-hosted box)
  # so the sole required gate never blocks on runner availability; it is ~1 billed minute.
  # Point branch protection at this context ("CI required"), not the individual matrix jobs.
  ci-required:
    name: CI required
    if: always()
    needs: [changes, backend, backend-integration, admin, mobile, website]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
          echo "All required CI jobs succeeded or were skipped."

  # Builds the three deployable images once, in CI, and pushes them to the GitHub
  # Container Registry (GHCR). The goal is for the prod box to pull these exact,
  # already-tested images instead of building on the server.
  #
  # ADDITIVE FOR NOW: the deploy job below still builds on the box. This job only
  # populates the registry so the images can be verified (and pulled from the box by
  # hand) before a follow-up PR flips deploy from `build` to `pull`. Nothing downstream
  # depends on it yet, so a failure here cannot break a deploy.
  images:
    name: Build & push images (GHCR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, backend-integration, admin, website]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets GITHUB_TOKEN push to this repo's own GHCR namespace — no PAT needed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --password-stdin keeps the token out of the process argv and the run log.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # GHCR rejects uppercase image paths and github.repository_owner can carry capitals
      # on some accounts, so lowercase it once here and reuse it.
      - name: Resolve registry namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Each image is tagged with both the commit SHA (immutable — what a deploy pins to)
      # and `main` (a moving pointer at the tip, handy for manual pulls). Build contexts
      # and Dockerfile paths mirror docker-compose.prod.yml exactly.
      - name: Build & push backend
        run: |
          IMG=ghcr.io/${{ steps.ns.outputs.owner }}/fuelflow-backend
          docker build -f backend/src/FuelFlow.API/Dockerfile \
            -t "$IMG:${{ github.sha }}" -t "$IMG:main" backend
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:main"

      # VITE_SENTRY_DSN is baked into the static bundle at build time. It is a write-only
      # ingest key (public by design, not an account secret), so it lives in a repo
      # VARIABLE — not a secret. Unset => empty => admin Sentry stays off, exactly as an
      # unset ADMIN_SENTRY_DSN does on the box today. Set the repo variable ADMIN_SENTRY_DSN
      # to keep admin error tracking on for the CI-built image.
      - name: Build & push admin
        run: |
          IMG=ghcr.io/${{ steps.ns.outputs.owner }}/fuelflow-admin
          docker build -f admin/Dockerfile \
            --build-arg VITE_SENTRY_DSN="${{ vars.ADMIN_SENTRY_DSN }}" \
            -t "$IMG:${{ github.sha }}" -t "$IMG:main" admin
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:main"

      - name: Build & push website
        run: |
          IMG=ghcr.io/${{ steps.ns.outputs.owner }}/fuelflow-website
          docker build -f website/Dockerfile \
            -t "$IMG:${{ github.sha }}" -t "$IMG:main" website
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:main"

  # Pre-prod gate: deploys the STAGING stack (docker-compose.staging.yml) on the same box
  # and smoke-tests it over localhost BEFORE prod. The prod `deploy` job `needs` this one,
  # so a staging pull/boot/smoke failure stops the change ever reaching prod. Staging pulls
  # the SAME image (pinned by this commit's SHA) that prod is about to run.
  #
  # Requires the box to be set up for staging (deploy/.env.staging present, the
  # `fuelflow_shared` network created — see docs/DEPLOYMENT.md "Staging (same box)"). Until
  # that's done this job fails, which by design also holds prod back.
  deploy-staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, backend-integration, admin, mobile, website, images]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sync deployment checkout
        run: |
          set -euo pipefail
          cd /root/FuelFlow
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy staging
        run: |
          set -euo pipefail
          cd /root/FuelFlow/deploy
          export IMAGE_TAG=${{ github.sha }}
          docker compose --env-file .env.staging -f docker-compose.staging.yml pull
          docker compose --env-file .env.staging -f docker-compose.staging.yml up -d

      - name: Smoke test staging
        run: |
          set -euo pipefail
          sleep 15
          # Staging publishes only on localhost; this proves the freshly-pulled image boots
          # and serves BEFORE prod is touched. Public routing (Caddy + Basic auth) refreshes
          # in the prod deploy's Caddy step below.
          #
          # The backend runs ASP.NET Core host filtering (AllowedHosts in
          # docker-compose.staging.yml). A request to 127.0.0.1 carries Host "127.0.0.1",
          # which is not in that list, so /health answers 400 before it runs. Send an
          # already-allowed Host instead: "dotnet-backend" is the in-network service name
          # and is in AllowedHosts, so this reaches a real 200. The two frontends are nginx
          # and don't host-filter, so they need no such header.
          curl -fsS -H "Host: dotnet-backend" http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:15000/ -o /dev/null
          curl -fsS http://127.0.0.1:15001/ -o /dev/null

  # Deploys to the single Hetzner production server after every green push to main — but
  # ONLY after staging above deployed and smoke-tested clean (staging-gate flow).
  # Runs on a self-hosted GitHub Actions runner installed on the server itself (connects
  # outbound to GitHub, bypassing the firewall that blocks SSH from cloud runners).
  # Pull-from-GHCR: the box no longer builds. It pulls the exact images the `images`
  # job built and pushed for THIS commit (pinned by SHA), so what runs in prod is
  # byte-for-byte what CI tested — and what staging just ran.
  deploy:
    name: Deploy to Hetzner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, backend-integration, admin, mobile, website, images, deploy-staging]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read   # lets GITHUB_TOKEN pull the images the `images` job pushed
    steps:
      - name: Sync deployment checkout
        run: |
          set -euo pipefail
          cd /root/FuelFlow
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

      # --password-stdin keeps the token out of argv and the run log. The credential
      # is a short-lived GITHUB_TOKEN, so the ~/.docker/config.json it writes is useless
      # once the job ends.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # A malformed Caddyfile (e.g. an unset STAGING_* var → empty site address) would crash
      # caddy on force-recreate and take prod's ONLY public ingress down. Validate the rendered
      # config in a throwaway container FIRST — set -e aborts the whole deploy before anything
      # is pulled or restarted, so the running caddy is left untouched on any config error.
      - name: Validate Caddyfile
        run: |
          set -euo pipefail
          cd /root/FuelFlow/deploy
          # `caddy` here is the compose service name; `--entrypoint caddy` makes the
          # container run the caddy binary, so the args become `caddy validate ...`.
          # Without it the container tries to exec `validate` directly (not on PATH) and
          # the step dies before validating anything. --env-file .env still applies, so an
          # unset STAGING_* still fails validation (the intended fail-safe) — this only
          # fixes how caddy is invoked, not what it checks.
          docker compose --env-file .env -f docker-compose.prod.yml run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Pull and restart
        run: |
          set -euo pipefail
          cd /root/FuelFlow/deploy
          # Pin to the exact images this run built — the `images` job tagged them with
          # this same github.sha. set -e makes a failed pull abort BEFORE `up`, so a
          # missing or unauthorized image can never silently fall back to an on-box build.
          export IMAGE_TAG=${{ github.sha }}
          docker compose --env-file .env -f docker-compose.prod.yml pull
          docker compose --env-file .env -f docker-compose.prod.yml up -d
          # The Caddyfile is bind-mounted as a SINGLE file. Git updates files by
          # atomic rename, so after `git reset` the container's bind mount still
          # pins the OLD inode - even `caddy reload` re-reads the stale contents
          # and edge config edits silently never apply. Force-recreate instead:
          # a fresh container re-binds the new file.
          docker compose --env-file .env -f docker-compose.prod.yml up -d --force-recreate caddy

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS https://api.palne.shop/health
          curl -fsS https://palne.shop/ -o /dev/null
          curl -fsS https://palne.shop/support/ -o /dev/null
          # An allow-listed admin endpoint must reach the backend, never be
          # swallowed by the admin domain's allow-list 404. This probes the
          # session-logout route the admin SPA actually calls; a 404 here means
          # the reverse-proxy allow-lists have drifted from the SPA's surface
          # (deploy/Caddyfile + admin/nginx.conf) - the exact regression that let
          # the admin log back in after logout. Unauthenticated with no cookie it
          # returns 200; the assertion only cares that it is not a 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://app.palne.shop/api/auth/refresh/logout)
          echo "logout probe: $code"
          [ "$code" != "404" ] || exit 1
