name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"
  # Pinned release + its published SHA256. Bumping the version means bumping the digest;
  # see the "Gitleaks detect" step for why the digest is not optional.
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer: whoever can push to the action's repository can move v7 to different code, and
# every workflow that references v7 executes it on the next run with this repo checked out
# and the job's token in the environment. The trailing comment records which release each
# SHA was, so upgrades stay reviewable.

jobs:
  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks detect
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz

          # This binary runs with the repository checked out and the job token in the
          # environment. Without a digest check, anyone who can serve a different
          # response for that URL - a compromised release asset, a hijacked redirect,
          # a proxy in the path - gets arbitrary code execution inside CI, and the job
          # still reports "no leaks found".
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --report-format json --report-path gitleaks-report.json --exit-code 1

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - testProject: tests/FuelFlow.Providers.UnitTests/FuelFlow.Providers.UnitTests.csproj
            testDir: tests/FuelFlow.Providers.UnitTests
            testName: providers
          - testProject: tests/FuelFlow.UnitTests/FuelFlow.UnitTests.csproj
            testDir: tests/FuelFlow.UnitTests
            testName: unit
          - testProject: tests/FuelFlow.JobsWorker.UnitTests/FuelFlow.JobsWorker.UnitTests.csproj
            testDir: tests/FuelFlow.JobsWorker.UnitTests
            testName: jobs-worker
          - testProject: tests/FuelFlow.IntegrationTests/FuelFlow.IntegrationTests.csproj
            testDir: tests/FuelFlow.IntegrationTests
            testName: integration
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/FuelFlow.API/FuelFlow.API.csproj

      - name: Test (${{ matrix.testName }})
        run: dotnet test "${{ matrix.testProject }}" --no-restore --verbosity minimal --logger "trx;LogFileName=test-results.trx"

      - name: Build API
        run: dotnet build src/FuelFlow.API/FuelFlow.API.csproj --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.testName }}
          path: backend/${{ matrix.testDir }}/TestResults/test-results.trx
          if-no-files-found: ignore
          retention-days: 7

  # FF-33 was found by build warnings alone; these gates make the rest of the advisory
  # picture visible on every push instead of unlooked-for (P3 hygiene, see
  # docs/SECURITY_AUDIT_2026-08-21.md).
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NuGet vulnerable packages
        working-directory: backend
        run: |
          dotnet restore FuelFlow.slnx
          dotnet list FuelFlow.slnx package --vulnerable --include-transitive

      - name: npm audit (admin)
        working-directory: admin
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      # Highs remain in mobile's Expo 54 SDK toolchain (metro→image-size, postcss, uuid);
      # npm's only offered fix is a breaking expo@57 upgrade. Gated at critical until that
      # SDK upgrade is scheduled and tested - same acknowledged-risk posture as the FF-03
      # gate below. Re-review by 2026-11-30.
      - name: npm audit (mobile)
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=critical

  admin:
    name: Admin (Vite React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Expo RN)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # FF-03: refuses an OTA update channel that is enabled but unsigned.
      #
      # FUELFLOW_ACK_UNSIGNED_OTA is set below so this reports rather than blocks, because the fix
      # cannot land in CI: it needs a signing keypair and a new native build released to both stores.
      # The acknowledgement is deliberately visible here rather than hidden in the script's defaults.
      #
      # DELETE THE env BLOCK once update signing ships. Re-review by 2026-11-30 if it has not.
      # Tracked as blockers 1 and 2 in docs/SECURITY_AUDIT_2026-08-21.md.
      - name: OTA update signing gate (FF-03)
        run: npm run check:ota-signing
        env:
          FUELFLOW_ACK_UNSIGNED_OTA: 'true'

      # EAS cloud builders never receive gitignored .env files, so a build without a declared
      # URL ships an app that dials localhost (the Aug 2026 TestFlight outage). This gate fails
      # unless every build profile declares EXPO_PUBLIC_API_URL and no second source exists.
      - name: API base URL gate
        run: npm run check:api-config

  # Deploys to the single Hetzner production server after every green push to main.
  # Build-on-server (not image registry + pull): the compose builds the images on the box,
  # and this job is just the trigger + status. The server has an 8 GB CX23 so the build fits.
  #
  # Requires two repo secrets:
  #   HETZNER_HOST     - public IPv4 of the server (e.g. 167.233.193.171)
  #   HETZNER_SSH_KEY  - private key whose public half is in the server's ~/.ssh/authorized_keys
  #
  # The server itself must hold a git clone of this repo (so `git pull` works) with a read-only
  # deploy key, and the real secrets stay in deploy/.env which is gitignored and never shipped.
  deploy:
    name: Deploy to Hetzner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [secrets-scan, backend, dependency-audit, admin, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (pull, build, restart)
        run: |
          ssh -o BatchMode=yes root@"${{ secrets.HETZNER_HOST }}" \
            'cd /root/FuelFlow && git pull --ff-only origin main && \
             cd deploy && \
             docker compose --env-file .env -f docker-compose.prod.yml build && \
             docker compose --env-file .env -f docker-compose.prod.yml up -d'

      - name: Smoke test
        run: |
          sleep 20
          curl -fsS "https://api.${{ secrets.API_DOMAIN }}/health" \
            || curl -fsS "https://api.palne.shop/health"
