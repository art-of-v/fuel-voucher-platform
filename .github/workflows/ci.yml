name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer: whoever can push to the action's repository can move v7 to different code, and
# every workflow that references v7 executes it on the next run with this repo checked out
# and the job's token in the environment. The trailing comment records which release each
# SHA was, so upgrades stay reviewable.

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/FuelFlow.API/FuelFlow.API.csproj

      - name: Build API
        run: dotnet build src/FuelFlow.API/FuelFlow.API.csproj --no-restore

  admin:
    name: Admin (Vite React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Expo RN)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  website:
    name: Website (Next.js static)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  # Deploys to the single Hetzner production server after every green push to main.
  # Runs on a self-hosted GitHub Actions runner installed on the server itself (connects
  # outbound to GitHub, bypassing the firewall that blocks SSH from cloud runners).
  # Build-on-server: the compose builds the images on the box (4 GB CX22 + 2 GB
  # swap, fits).
  deploy:
    name: Deploy to Hetzner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, admin, mobile, website]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Pull latest main
        run: cd /root/FuelFlow && git pull --ff-only origin main

      - name: Build and restart
        run: |
          cd /root/FuelFlow/deploy
          docker compose --env-file .env -f docker-compose.prod.yml build
          docker compose --env-file .env -f docker-compose.prod.yml up -d
          # The Caddyfile is bind-mounted, so `up -d` does not recreate the caddy
          # container when its content changes. Reload explicitly or edge config
          # edits (e.g. the admin API allow-list) silently stay stale.
          docker compose --env-file .env -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS https://api.palne.shop/health
          curl -fsS https://palne.shop/ -o /dev/null
          curl -fsS https://palne.shop/support/ -o /dev/null
