name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"

# Third-party actions are pinned to a commit SHA rather than a tag. A tag is a mutable
# pointer: whoever can push to the action's repository can move v7 to different code, and
# every workflow that references v7 executes it on the next run with this repo checked out
# and the job's token in the environment. The trailing comment records which release each
# SHA was, so upgrades stay reviewable.

jobs:
  # Change detector — the cost gate for a PRIVATE repo. On a private repo every GitHub-hosted
  # job-minute is billed and rounded UP per job, so a job that only spins up (checkout +
  # toolchain) to then skip its work still bills ~a minute. The win is therefore to skip the
  # WHOLE job, not just its steps: a job never entered by its `if:` bills zero. Each matrix job
  # below gates its entire self on this detector's output, so an unrelated PR runs only this
  # detector plus the aggregator and bills almost nothing.
  #
  # The always-run `ci-required` aggregator (bottom of the matrix) is what makes full-job
  # skipping safe under branch protection: it is the SOLE required status check, so a skipped
  # matrix job never leaves a required context unreported — the deadlock that job-skipping
  # would otherwise cause on `enforce_admins` main.
  #
  # Pure `git diff` — deliberately NOT a third-party action (dorny/paths-filter et al.), so
  # the CI supply-chain surface is unchanged on a money repo that SHA-pins everything.
  # Fails OPEN: if the base commit or the diff is unavailable, every component is marked
  # changed so nothing is silently skipped. Any change OUTSIDE the four app dirs (repo-root
  # files, deploy/, docs/, .github/**) also runs everything — a shared or CI change can affect
  # any component, so the safe default there is the full matrix.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      website: ${{ steps.filter.outputs.website }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        run: |
          set -euo pipefail
          allchanged=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — running all suites."
            allchanged=1; changed=""
          else
            changed="$(git diff --name-only "$base" "${{ github.sha }}")" || { echo "diff failed — running all suites."; allchanged=1; changed=""; }
          fi
          echo "Changed files:"; echo "$changed"
          backend=false; admin=false; mobile=false; website=false; deploy=false; other=false
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            case "$f" in
            backend/*) backend=true ;;
            admin/*)   admin=true ;;
            mobile/*)  mobile=true ;;
            website/*) website=true ;;
            deploy/*)  deploy=true; other=true ;;
            *)         other=true ;;
            esac
          done <<< "$changed"
          # A change to shared/root/CI/deploy files, or an unreadable diff, exercises everything.
          if [ "$allchanged" = "1" ] || [ "$other" = "true" ]; then
            backend=true; admin=true; mobile=true; website=true
          fi
          for kv in "backend=$backend" "admin=$admin" "mobile=$mobile" "website=$website" "deploy=$deploy"; do
            echo "$kv" >> "$GITHUB_OUTPUT"; echo "$kv"
          done

  # PUSHES ARE FILTERED TOO. The `|| github.event_name == 'push'` escape hatch that used to sit on
  # every matrix job ("main must always re-test everything") meant a website-only merge still ran
  # the Testcontainers suite end to end - 14m47 of a 17m run spent re-testing a component the diff
  # did not touch. The `changes` job above already computes the same diff for push events (via
  # `github.event.before`), so main now runs the same matrix the PR did, and the diff it filters
  # on is exactly the one the PR was gated on.
  #
  # The consequence is that a component's check job can now report SKIPPED on main, and everything
  # downstream of it has to treat skipped as "nothing to do" rather than as a failure:
  #   * the image-* jobs gained `always()` - a skipped need would otherwise skip them, and the
  #     component would silently stop getting an image built for that commit;
  #   * deploy-staging / deploy accept `skipped` alongside `success`, and still refuse `failure`.
  # A held component is not a broken release: `deploy/resolve-image-tags.sh` pins it to its last
  # successful build, which is the partial-release behaviour those jobs already document.
  #
  # Root-file, deploy/ and .github/** changes still set every flag, so a change to shared
  # infrastructure (this file included) runs the whole matrix.
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache the global NuGet package store between runs. This repo has no lock files or a
      # central Directory.Packages.props, so versions live in the .csproj files — key on the
      # union of them. The same key warms the backend-integration job below.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restore every project ONCE here; Build / scan / unit-test steps below all run
      # --no-restore, so the restore graph is computed a single time instead of being
      # repeated by each of them (the scan used to re-restore all of them on its own). The
      # project list is explicit rather than the .slnx for the same reason the scan lists
      # them: the .slnx omits FuelFlow.Brands.UnitTests, which CI still builds and tests.
      - name: Restore
        run: |
          set -euo pipefail
          projects=(
            src/FuelFlow.API/FuelFlow.API.csproj
            src/FuelFlow.JobsWorker/FuelFlow.JobsWorker.csproj
            tests/FuelFlow.UnitTests/FuelFlow.UnitTests.csproj
                    tests/FuelFlow.Brands.UnitTests/FuelFlow.Brands.UnitTests.csproj
            tests/FuelFlow.IntegrationTests/FuelFlow.IntegrationTests.csproj
          )
          for proj in "${projects[@]}"; do dotnet restore "$proj"; done

      - name: Build API
        run: dotnet build src/FuelFlow.API/FuelFlow.API.csproj --no-restore

      # dotnet-ef is a global tool, not a package the build pulls in, so it is absent from a fresh
      # runner image. Pinned to match Microsoft.EntityFrameworkCore.Design in FuelFlow.API.csproj —
      # bump both together. Without this the step below fails with "dotnet-ef does not exist on the
      # PATH", which reads like a schema problem and is not one.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      # Catches "I changed an entity and forgot the migration". AGENTS.md requires the migration
      # because auto-deploy runs Migrate() on boot and a missing migration is a runtime crash -
      # but nothing enforced it, and the Testcontainers job below cannot catch it either: it
      # migrates from zero, so it only proves the migrations that DO exist apply cleanly, not that
      # the model and the snapshot still agree.
      #
      # ~20s. Exits non-zero exactly when the model has changes with no migration. Needs no
      # database: it diffs the model against the snapshot, it does not connect.
      - name: Verify migrations cover the model
        working-directory: backend
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/FuelFlow.API \
            --context ApplicationDbContext \
            --no-build

      # Fail the build on any known-vulnerable NuGet package, transitive included. This is
      # the gate that would have caught the Hangfire.Core -> Newtonsoft.Json 11.0.1 advisory
      # (GHSA-5crp-9r3c-p9vr) on the PR that introduced it, instead of a later audit.
      #
      # Two quirks force the shape of this step:
      #   * `dotnet list package --vulnerable` exits 0 even when it finds advisories, so the
      #     exit code is useless as a gate — we scan its OUTPUT for the finding marker instead.
      #   * --include-transitive is mandatory: the advisory that prompted this was purely
      #     transitive (nothing referenced Newtonsoft directly), so a direct-only scan is blind.
      # Every project is listed explicitly rather than via FuelFlow.slnx because the .slnx omits
      # FuelFlow.Brands.UnitTests (which CI still builds and tests), and the test projects
      # inherit the production transitive graph through their ProjectReferences.
      - name: Vulnerable dependency scan
        run: |
          set -euo pipefail
          projects=(
            src/FuelFlow.API/FuelFlow.API.csproj
            src/FuelFlow.JobsWorker/FuelFlow.JobsWorker.csproj
            tests/FuelFlow.UnitTests/FuelFlow.UnitTests.csproj
                    tests/FuelFlow.Brands.UnitTests/FuelFlow.Brands.UnitTests.csproj
            tests/FuelFlow.IntegrationTests/FuelFlow.IntegrationTests.csproj
          )
          report="$(mktemp)"
          for proj in "${projects[@]}"; do
            echo "== $proj =="
            dotnet list "$proj" package --vulnerable --include-transitive | tee -a "$report"
          done
          # Known-vulnerable packages fail the build - EXCEPT advisories explicitly accepted here.
          # Accepted risk (documented): all five below are SixLabors.ImageSharp 2.1.13 issues whose
          # ONLY fix is 4.1.2 - a major jump (ImageSharp 3.0+ is the Six Labors split-license, and
          # ZXing.Net.Bindings.ImageSharp.V2 pins us to the 2.x line). They are DoS /
          # resource-exhaustion bugs in image DECODING.
          #
          # This comment used to say the only decode path was operator voucher import. That was
          # wrong in a way that mattered, so here is the real one: voucher import never DECODES
          # anything. PdfRenderer.cs calls Image.LoadPixelData - it wraps the raw BGRA bytes
          # that Docnet native renderer already produced - and QrDecoder then does a CloneAs
          # pixel conversion. No production path invokes an ImageSharp decoder at all; the only
          # Image.Load calls in the solution are in QrServiceTests, against fixtures committed
          # to this repository.
          #
          # So the exposure is narrower than an import path would be, and replacing ZXing to
          # reach 4.1.2 would mean reimplementing QR version detection and format parsing
          # through ZXing internals - on the voucher-import money path - to close advisories
          # that cannot fire. That trade was rejected; see planning#323.
          #
          # These started failing CI when the advisories were published (the audit hits
          # the live GitHub Advisory DB each run), not because of any code change.
          #   Moderate: GHSA-gwg2-r3hj-4w44, GHSA-wmxv-xphr-5c9g
          #   High:     GHSA-j3p4-wp97-rph4, GHSA-j9gm-c75j-xc9q, GHSA-jjfr-hcj7-qf5w
          # The report lists each advisory as a GHSA URL; fail only on ids NOT accepted above.
          unexpected="$(grep -Eo 'GHSA-[0-9A-Za-z-]+' "$report" | sort -u | grep -vxF -e GHSA-gwg2-r3hj-4w44 -e GHSA-wmxv-xphr-5c9g -e GHSA-j3p4-wp97-rph4 -e GHSA-j9gm-c75j-xc9q -e GHSA-jjfr-hcj7-qf5w || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Vulnerable NuGet packages detected (not in the accepted-risk allow-list) — see the scan output above:"
            echo "$unexpected"
            exit 1
          fi
          echo "No vulnerable packages found (accepted-risk advisories excluded: ImageSharp 2.1.13 x5)."

      # Fast, hermetic tests (in-memory EF, no external services). The Docker-backed
      # integration suite runs in its own job below so a Postgres pull never slows this down.
      - name: Unit tests
        run: |
          dotnet test tests/FuelFlow.UnitTests/FuelFlow.UnitTests.csproj --configuration Release --no-restore
          dotnet test tests/FuelFlow.Brands.UnitTests/FuelFlow.Brands.UnitTests.csproj --configuration Release --no-restore

  backend-integration:
    name: Backend integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The heaviest job in the matrix: Testcontainers spins up Postgres via the Docker daemon
      # preinstalled on GitHub-hosted ubuntu runners. The whole job is gated (job-level `if:`
      # above), so on a PR or push that did not touch backend/ it never starts and bills zero
      # minutes — worth doing carefully, because it is the job that decides the release: it was
      # 13m23 of a 17m run. Its own fixture now starts one container for the whole suite and clones
      # a migrated database per test class, instead of one container plus 88 replayed migrations per
      # class. Pull the Postgres image up front, with retries.
      #
      # `postgres:16-alpine` comes from Docker Hub, and GitHub-hosted runners share egress IPs, so
      # an anonymous pull here competes with every other job on the runner pool and intermittently
      # loses. The symptom is brutal to read: Testcontainers cannot start, the fixture throws, and
      # the whole integration assembly is reported as failed - including every test that has
      # nothing to do with the change under test. The failure text points at a 40-line timeout in a
      # fixture, not at a registry.
      #
      # Doing it in its own step, before any test runs, means the two failures cannot be confused:
      # a red "Integration tests" step is now a real test failure. The retry covers the transient
      # case, which the original report measured at roughly two runs in three.
      #
      # Not fixed here: a *sustained* limit would need either authentication (a DOCKERHUB_TOKEN
      # secret, which raises this from the anonymous quota to an account quota) or a mirror. Both
      # are one-line changes if this step starts failing regularly - see docs/TESTING.md (private docs repo).
      - name: Pull the Testcontainers Postgres image
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:16-alpine; then
              echo "pulled on attempt $attempt"
              exit 0
            fi
            echo "::warning::Docker Hub rate limit or transient pull failure (attempt $attempt/5); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Could not pull postgres:16-alpine after 5 attempts. This is registry throttling, not a code fault - re-run rather than investigate."
          exit 1

      # TEMPORARY MEASUREMENT - throwaway, revert after reading the answer.
      # The default console logger only prints a summary, so the 10m54s this step takes is a single
      # number with no way to attribute it. `verbosity=normal` makes it print every test as it
      # completes, with its own duration, which is the only way to find out whether the remaining
      # time is test bodies or the ~33 WebApplicationFactory host boots.
      - name: Integration tests
        run: dotnet test tests/FuelFlow.IntegrationTests/FuelFlow.IntegrationTests.csproj --configuration Release --logger "console;verbosity=normal"

  admin:
    name: Admin (Vite React)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Expo RN)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The whole job is gated (job-level `if:` above): it runs only when mobile/** changed,
      # on a PR or on a push alike. The app is pure frontend with no build-time contract shared
      # with the backend, so skipping it on an unrelated change cannot mask a cross-side break.
      - name: Install
        run: npm ci

      # FF-03 hard gate: an enabled OTA update channel (expo.updates.enabled != false with a
      # url set) MUST ship a code-signing certificate, or the client accepts any manifest the
      # channel serves — arbitrary code on every install, checkout/payment screens included.
      # No FUELFLOW_ACK_UNSIGNED_OTA is set here on purpose: signing is now in place, so this
      # is a real gate, not an acknowledged warning. See mobile/scripts/check-update-signing.mjs
      # and art-of-v/fuel-voucher-platform-planning#42.
      - name: OTA update signing gate (FF-03)
        run: npm run check:ota-signing

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Makes `.prettierrc.json` binding. The config was previously unenforced:
      # `format:check` failed on main, so nothing gated it and no PR could trip it.
      # `main` is green here, so this only fails on genuinely unformatted new work.
      #
      # A step in this job rather than its own job on purpose: `npm ci` above already
      # installed the pinned Prettier from package-lock.json, so the check costs a few
      # seconds instead of billing another private-repo job-minute, and the existing
      # `ci-required` aggregator already makes it a required check.
      #
      # Ordering matters: this sits with the cheap static checks, before Jest, so an
      # unformatted file fails the run without first paying for the test suite.
      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

  website:
    name: Website (Next.js static)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.website == 'true'
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Guards the header's responsive ladder, the hero being visible at all
      # (including with JavaScript off), and the tap-target floor. The centred
      # nav overlapping the download CTA, a burger squeezed to 2px, and a hero
      # whose headline never painted have all shipped - none is visible in
      # review. The first three measure the exported CSS, so they need the Build
      # step above; the header check also starts nginx with the shipped
      # nginx.conf, which nothing else here would exercise.
      - name: Check layout, hero and caching
        run: npm run check

  # The SINGLE required status check on branch-protected main. Every matrix job above can be
  # fully skipped on an unrelated PR (that is the private-repo cost win) — but a skipped job
  # reports NO status, so if the matrix jobs themselves were the required contexts, branch
  # protection would wait forever for a context that never arrives (with strict + enforce_admins
  # the PR is then unmergeable). This always-run job depends on all of them and collapses their
  # results into one: it passes when each dependency SUCCEEDED or was SKIPPED, and fails only if
  # any genuinely FAILED or was CANCELLED. It stays on a hosted runner (not the self-hosted box)
  # so the sole required gate never blocks on runner availability; it is ~1 billed minute.
  # Point branch protection at this context ("CI required"), not the individual matrix jobs.
  # deploy/ scripts decide what runs on the box: the disk-pressure check and the systemd units that
  # schedule it, the image-tag resolver, the backup/GC jobs. None of them is covered by the four
  # component suites, and their own .test.sh harnesses run only inside the deploy jobs - which means
  # a PR could merge a broken script and the first thing that noticed would be a deploy that failed
  # before staging. One short job, gated on deploy/ changing, so the failure shows up on the PR.
  #
  # Cost: a fully skipped job bills 0 (#3), and deploy/ changes are rare, so this is close to free.
  deploy-scripts:
    name: Deploy scripts (bash)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Drives every branch of disk-check.sh with a stubbed df and a throwaway state file: the
      # healthy silence, each escalation, the dedup that keeps a stuck disk from paging 96 times a
      # day, and the two ways the check can fail to measure at all. None of it is observable on a
      # box that is not already in trouble.
      - name: Test the disk pressure check
        run: bash deploy/disk-check.test.sh

  ci-required:
    name: CI required
    if: always()
    needs: [changes, backend, backend-integration, admin, mobile, website, deploy-scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
          echo "All required CI jobs succeeded or were skipped."

  # Builds the three deployable images once, in CI, and pushes them to the GitHub
  # Container Registry (GHCR). The goal is for the prod box to pull these exact,
  # already-tested images instead of building on the server.
  #
  # One job per component, not one job with three steps. A single job serialised
  # them AND made every failure look like "the images are broken": a website that
  # cannot reach fonts.gstatic.com reported as a failure of the admin image too,
  # and because the deploys gate on this job, an unrelated component's flake held
  # every release. Split, a failure names its component, the three build in
  # parallel, and each can be retried on its own.
  #
  # The release is PARTIAL, not atomic: compose tags each component separately and
  # deploy/resolve-image-tags.sh sends each one to this commit's SHA when its image
  # built, or to `main` (that component's last successful build) when it did not. A
  # broken build in one component therefore neither rolls back nor blocks the others.
  # The trade-off is real and worth stating: a held component stays on its previous
  # version until a fix reaches main, so it is announced as a workflow warning and the
  # resolved digests are printed after every deploy. A TOTAL failure — no component
  # built — is a failed release and stays red rather than silently redeploying.
  #
  # Each job needs only its own component's checks, so a green admin image does
  # not wait on the website suite, and vice versa.

  # `always()` is load-bearing, not decoration — and it is only half the condition.
  #
  # A job whose `needs` were SKIPPED is itself skipped unless its own `if:` opts out of that rule,
  # and now that pushes are change-filtered a component's check job IS skipped when the diff did
  # not touch it. Without `always()` here, a backend-only merge would stop building the admin and
  # website images; resolve-image-tags.sh would then read those two as `skipped`, hand the box the
  # moving `main` tag instead of this commit's SHA, and report every such merge as a partial
  # release. So `always()` is what keeps a skipped component still getting an image.
  #
  # But `always()` also fires on FAILED needs, which is not wanted: a red backend check would still
  # build and push a `:${sha}` backend image for a commit whose backend tests did not pass. The
  # release is still stopped (deploy-staging and deploy both refuse `failure`), so nothing reaches
  # prod — but it burns a Docker build, pushes an image that must never be deployed, and, worse,
  # breaks the meaning of the `BACKEND_RESULT` that resolve-image-tags.sh is handed: it receives
  # `needs.image-backend.result`, so `success` there would mean "the Docker build worked" instead
  # of "this component passed its checks for this commit". Inert today, a landmine the day some
  # gate is relaxed.
  #
  # Hence `success || skipped` spelled out: opt out of the skip-on-skipped-needs rule, keep the
  # skip-on-failed-needs behaviour that predates the change filter. `!cancelled()` keeps a
  # superseded run from starting new work.
  image-backend:
    name: Build & push backend image
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.backend-integration.result == 'success' || needs.backend-integration.result == 'skipped')
    needs: [backend, backend-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets GITHUB_TOKEN push to this repo's own GHCR namespace — no PAT needed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --password-stdin keeps the token out of the process argv and the run log.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # GHCR rejects uppercase image paths and github.repository_owner can carry capitals
      # on some accounts, so lowercase it once here and reuse it.
      - name: Resolve registry namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Each image is tagged with both the commit SHA (immutable — what a deploy pins to)
      # and `main` (a moving pointer at the tip, handy for manual pulls). Build contexts
      # and Dockerfile paths mirror docker-compose.prod.yml exactly.
      - name: Build & push backend
        run: |
          IMG=ghcr.io/${{ steps.ns.outputs.owner }}/fuelflow-backend
          docker build -f backend/src/FuelFlow.API/Dockerfile \
            -t "$IMG:${{ github.sha }}" -t "$IMG:main" backend
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:main"

  image-admin:
    name: Build & push admin image
    # Same success-or-skipped rule as image-backend, and for the same reason.
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped')
    needs: [admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve registry namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # VITE_SENTRY_DSN is baked into the static bundle at build time. It is a write-only
      # ingest key (public by design, not an account secret), so it lives in a repo
      # VARIABLE — not a secret. Unset => empty => admin Sentry stays off, exactly as an
      # unset ADMIN_SENTRY_DSN does on the box today. Set the repo variable ADMIN_SENTRY_DSN
      # to keep admin error tracking on for the CI-built image.
      - name: Build & push admin
        run: |
          IMG=ghcr.io/${{ steps.ns.outputs.owner }}/fuelflow-admin
          docker build -f admin/Dockerfile \
            --build-arg VITE_SENTRY_DSN="${{ vars.ADMIN_SENTRY_DSN }}" \
            -t "$IMG:${{ github.sha }}" -t "$IMG:main" admin
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:main"

  image-website:
    name: Build & push website image
    # Same success-or-skipped rule as image-backend, and for the same reason.
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.website.result == 'success' || needs.website.result == 'skipped')
    needs: [website]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve registry namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push website
        run: |
          IMG=ghcr.io/${{ steps.ns.outputs.owner }}/fuelflow-website
          docker build -f website/Dockerfile \
            -t "$IMG:${{ github.sha }}" -t "$IMG:main" website
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:main"

  # Pre-prod gate: deploys the STAGING stack (docker-compose.staging.yml) on the same box
  # and smoke-tests it over localhost BEFORE prod. The prod `deploy` job `needs` this one,
  # so a staging pull/boot/smoke failure stops the change ever reaching prod.
  #
  # PARTIAL RELEASES: the `if:` below admits an image job that FAILED — only a failed
  # *check* job blocks. A component whose image did not build stays on its last good
  # build (`main`) and the rest of the release ships; see resolve-image-tags.sh. Staging
  # resolves tags the same way prod does, so the two stay in lockstep and the smoke test
  # still proves what prod is about to run.
  #
  # Requires the box to be set up for staging (deploy/.env.staging present, the
  # `fuelflow_shared` network created — see docs/DEPLOYMENT.md (private docs repo) "Staging (same box)"). Until
  # that's done this job fails, which by design also holds prod back.
  deploy-staging:
    name: Deploy to staging
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.backend-integration.result == 'success' || needs.backend-integration.result == 'skipped') &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped') &&
      (needs.mobile.result == 'success' || needs.mobile.result == 'skipped') &&
      (needs.website.result == 'success' || needs.website.result == 'skipped')
    needs: [backend, backend-integration, admin, mobile, website, image-backend, image-admin, image-website]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sync deployment checkout
        run: |
          set -euo pipefail
          cd /root/FuelFlow
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

      # Runs before the resolver, on the self-hosted runner, so it costs nothing and
      # covers the moment that matters: a broken resolver fails the deploy before any
      # image is pulled or any container is restarted. In both deploy jobs, because
      # re-running only the prod job is a normal thing to do after a failure.
      - name: Test deploy image-tag resolver
        run: bash /root/FuelFlow/deploy/resolve-image-tags.test.sh

# #219: the real .env files are gitignored and box-only, so nothing caught a typo
      # in them until a deploy ran - and because the workflow chains staging BEFORE
      # production, a staging failure silently SKIPPED the production deploy, leaving main
      # red for two merges with nothing in the diff to explain it. The examples are in the
      # repo, so the class of defect is checkable here, before anything is pulled or
      # restarted. In both deploy jobs, for the same reason as the resolver test above.
      - name: Validate deploy env templates
        run: bash /root/FuelFlow/deploy/env-validation.test.sh

      # The test above checks the templates an operator copies FROM. This one checks the
      # files on the box itself, which is where the defect actually was and which the
      # template test explicitly cannot reach. --env-only stops after the env scan, so it
      # costs a second and never touches a container.
      - name: Check the box env files are readable by Compose
        run: bash /root/FuelFlow/deploy/preflight.sh --env-only

      - name: Resolve image tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          BACKEND_RESULT: ${{ needs.image-backend.result }}
          ADMIN_RESULT: ${{ needs.image-admin.result }}
          WEBSITE_RESULT: ${{ needs.image-website.result }}
        run: bash /root/FuelFlow/deploy/resolve-image-tags.sh

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy staging
        env:
          BACKEND_IMAGE_TAG: ${{ steps.tags.outputs.backend_tag }}
          ADMIN_IMAGE_TAG: ${{ steps.tags.outputs.admin_tag }}
          WEBSITE_IMAGE_TAG: ${{ steps.tags.outputs.website_tag }}
        run: |
          set -euo pipefail
          cd /root/FuelFlow/deploy
          docker compose --env-file .env.staging -f docker-compose.staging.yml pull
          docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
          # Records what is actually running, by digest, so a later "which version is
          # prod on?" is answerable from the log even when a component was held on `main`.
          docker compose --env-file .env.staging -f docker-compose.staging.yml images

      - name: Smoke test staging
        run: |
          set -euo pipefail
          sleep 15
          # Staging publishes only on localhost; this proves the freshly-pulled image boots
          # and serves BEFORE prod is touched. Public routing (Caddy + Basic auth) refreshes
          # in the prod deploy's Caddy step below.
          #
          # The backend runs ASP.NET Core host filtering (AllowedHosts in
          # docker-compose.staging.yml). A request to 127.0.0.1 carries Host "127.0.0.1",
          # which is not in that list, so /health answers 400 before it runs. Send an
          # already-allowed Host instead: "dotnet-backend" is the in-network service name
          # and is in AllowedHosts, so this reaches a real 200. The two frontends are nginx
          # and don't host-filter, so they need no such header.
          curl -fsS -H "Host: dotnet-backend" http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:15000/ -o /dev/null
          curl -fsS http://127.0.0.1:15001/ -o /dev/null

  # Deploys to the single Hetzner production server after every green push to main — but
  # ONLY after staging above deployed and smoke-tested clean (staging-gate flow).
  # Runs on a self-hosted GitHub Actions runner installed on the server itself (connects
  # outbound to GitHub, bypassing the firewall that blocks SSH from cloud runners).
  # Pull-from-GHCR: the box no longer builds. It pulls the exact images the
  # `image-*` jobs built for THIS commit, so what runs in prod is byte-for-byte what
  # CI tested — and what staging just ran. A component whose image failed to build is
  # held on its last successful build instead of blocking the whole release; the tag
  # is resolved the same way as in staging, so the two never disagree.
  deploy:
    name: Deploy to Hetzner
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.backend-integration.result == 'success' || needs.backend-integration.result == 'skipped') &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped') &&
      (needs.mobile.result == 'success' || needs.mobile.result == 'skipped') &&
      (needs.website.result == 'success' || needs.website.result == 'skipped') &&
      needs.deploy-staging.result == 'success'
    needs: [backend, backend-integration, admin, mobile, website, image-backend, image-admin, image-website, deploy-staging]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read   # lets GITHUB_TOKEN pull the images the `image-*` jobs pushed
    steps:
      - name: Sync deployment checkout
        run: |
          set -euo pipefail
          cd /root/FuelFlow
          git fetch --prune origin main
          git reset --hard origin/main
          git clean -fd

      # Runs before the resolver, on the self-hosted runner, so it costs nothing and
      # covers the moment that matters: a broken resolver fails the deploy before any
      # image is pulled or any container is restarted. In both deploy jobs, because
      # re-running only the prod job is a normal thing to do after a failure.
      - name: Test deploy image-tag resolver
        run: bash /root/FuelFlow/deploy/resolve-image-tags.test.sh

# #219: the real .env files are gitignored and box-only, so nothing caught a typo
      # in them until a deploy ran - and because the workflow chains staging BEFORE
      # production, a staging failure silently SKIPPED the production deploy, leaving main
      # red for two merges with nothing in the diff to explain it. The examples are in the
      # repo, so the class of defect is checkable here, before anything is pulled or
      # restarted. In both deploy jobs, for the same reason as the resolver test above.
      - name: Validate deploy env templates
        run: bash /root/FuelFlow/deploy/env-validation.test.sh

      # Unit tests for the preflight itself: the scan against the real `\#` line that
      # caused all this, a non-assignment line, CRLF endings, and that a clean file is
      # accepted and its contents never echoed. Runs here because it is a deploy script.
      - name: Test the deploy preflight
        run: bash /root/FuelFlow/deploy/preflight.test.sh

      # ...and then run the whole preflight against the live box, so a bad .env, a bad
      # Caddyfile, an ambiguous upstream or a stale :main tag stops THIS deploy rather
      # than the next person who restarts something by hand.
      - name: Preflight the box
        run: bash /root/FuelFlow/deploy/preflight.sh

      - name: Resolve image tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          BACKEND_RESULT: ${{ needs.image-backend.result }}
          ADMIN_RESULT: ${{ needs.image-admin.result }}
          WEBSITE_RESULT: ${{ needs.image-website.result }}
        run: bash /root/FuelFlow/deploy/resolve-image-tags.sh

      # --password-stdin keeps the token out of argv and the run log. The credential
      # is a short-lived GITHUB_TOKEN, so the ~/.docker/config.json it writes is useless
      # once the job ends.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # A malformed Caddyfile (e.g. an unset STAGING_* var → empty site address) would crash
      # caddy on force-recreate and take prod's ONLY public ingress down. Validate the rendered
      # config in a throwaway container FIRST — set -e aborts the whole deploy before anything
      # is pulled or restarted, so the running caddy is left untouched on any config error.
      - name: Validate Caddyfile
        run: |
          set -euo pipefail
          cd /root/FuelFlow/deploy
          # `caddy` here is the compose service name; `--entrypoint caddy` makes the
          # container run the caddy binary, so the args become `caddy validate ...`.
          # Without it the container tries to exec `validate` directly (not on PATH) and
          # the step dies before validating anything. --env-file .env still applies, so an
          # unset STAGING_* still fails validation (the intended fail-safe) — this only
          # fixes how caddy is invoked, not what it checks.
          docker compose --env-file .env -f docker-compose.prod.yml run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Pull and restart
        env:
          BACKEND_IMAGE_TAG: ${{ steps.tags.outputs.backend_tag }}
          ADMIN_IMAGE_TAG: ${{ steps.tags.outputs.admin_tag }}
          WEBSITE_IMAGE_TAG: ${{ steps.tags.outputs.website_tag }}
        run: |
          set -euo pipefail
          cd /root/FuelFlow/deploy
          # Tags come from the resolve step: this commit's SHA for every component that
          # built, `main` (last successful build) for one that did not. set -e makes a
          # failed pull abort BEFORE `up`, so a missing or unauthorized image can never
          # silently fall back to an on-box build.
          docker compose --env-file .env -f docker-compose.prod.yml pull
          docker compose --env-file .env -f docker-compose.prod.yml up -d
          # What is actually running, by digest - the authoritative answer to "which
          # version is prod on?", and the way to spot a component left on its old build.
          docker compose --env-file .env -f docker-compose.prod.yml images
          # The Caddyfile is bind-mounted as a SINGLE file. Git updates files by
          # atomic rename, so after `git reset` the container's bind mount still
          # pins the OLD inode - even `caddy reload` re-reads the stale contents
          # and edge config edits silently never apply. Force-recreate instead:
          # a fresh container re-binds the new file.
          docker compose --env-file .env -f docker-compose.prod.yml up -d --force-recreate caddy

      - name: Smoke test
        run: |
          # Wait for the freshly-recreated backend to actually bind its port instead of a
          # blind `sleep 15`. `docker compose up -d` tears the old API container down and the
          # new one needs a few seconds (EF Migrate() + host start) before it answers; during
          # that window the proxy returns 502. Poll /health until it is ready so the deploy
          # fails fast with logs if the new image never comes up, rather than racing a sleep.
          for i in $(seq 1 30); do
            if curl -fsS https://api.palne.shop/health -o /dev/null; then
              echo "backend ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "backend did not become healthy within ~90s" >&2
              cd /root/FuelFlow/deploy
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail 100 dotnet-backend >&2 || true
              exit 1
            fi
            sleep 3
          done
          curl -fsS https://api.palne.shop/health
          curl -fsS https://palne.shop/ -o /dev/null
          curl -fsS https://palne.shop/support/ -o /dev/null
          # An allow-listed admin endpoint must reach the backend, never be
          # swallowed by the admin domain's allow-list 404. This probes the
          # session-logout route the admin SPA actually calls; a 404 here means
          # the reverse-proxy allow-lists have drifted from the SPA's surface
          # (deploy/Caddyfile + admin/nginx.conf) - the exact regression that let
          # the admin log back in after logout. Unauthenticated with no cookie it
          # returns 200; the assertion only cares that it is not a 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://app.palne.shop/api/auth/refresh/logout)
          echo "logout probe: $code"
          [ "$code" != "404" ] || exit 1
