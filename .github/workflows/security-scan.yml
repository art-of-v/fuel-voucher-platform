name: Security scan

# Fails the build if the config-file code-injection pattern (see scripts/security-scan.mjs)
# reappears in any tracked file. Cheap and dependency-free — just Node walking the tree —
# so it can gate every push and PR without slowing anything down.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Injected-payload scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Scan working tree
        run: node scripts/security-scan.mjs
