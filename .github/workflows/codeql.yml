name: CodeQL

# Static security analysis (SAST) — MANUAL-ONLY (workflow_dispatch), deliberately.
#
# **The repository is public until it is not.** It goes PRIVATE on 2026-11-01. On a
# personal-account private repository, code scanning cannot upload SARIF to the Security tab (that
# needs org-level GitHub Advanced Security), and every hosted job-minute is billed — so running
# CodeQL automatically on each push/PR would both fail at the upload step AND burn billable
# minutes. That is the reason this is manual, and the reason the two `Analyze (...)` contexts are
# not on main's required checks (planning #37).
#
# **Until the flip, a manual scan still reaches the Security tab** — the analysis is free while
# the repository is public — so the full scan is worth triggering before the flip, and again
# whenever something is worth knowing about.
#
# For ongoing coverage once private, use the local CodeQL CLI (planning #39) — that runs off
# GitHub, zero minutes.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode "none" analyzes source without a full compile — sidesteps the .NET SDK
          # setup and works with the multi-project layout.
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
