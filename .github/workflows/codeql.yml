name: CodeQL

# Static security analysis (SAST) — on every push and every pull request, plus a weekly scan.
#
# **This used to run only when you asked it to, and the reason was wrong.** The comment above
# said the repository goes PRIVATE on 2026-10-01, and that on a private repository code scanning
# cannot upload SARIF and every hosted job-minute is billed. Neither half of that is true of this
# repository: `art-of-v/fuel-voucher-platform` is **public** (checked 2026-10-19, and again on
# 2026-10-21 while this was being fixed), and code scanning is free on a public repository and
# its results reach the Security tab. The premise never started, so the analysis it switched off
# was never needed to be switched off.
#
# So it runs automatically now, and the "Analyze (csharp)" and "Analyze (javascript-typescript)"
# contexts are required checks on main: a finding is a finding whether anybody asked for the scan
# or not, and a scan that only runs when somebody remembers to ask for it is a scan that finds
# things the week after the code was written.
#
# If the repository does go private later, this file is what has to change with it - and the
# change is a decision, not a drift. The local CodeQL CLI (planning #39) is the fallback for a
# repository that cannot host the analysis.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly scan, so a dependency that turns vulnerable between pushes is still noticed.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode "none" analyzes source without a full compile — sidesteps the .NET SDK
          # setup and works with the multi-project layout.
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
