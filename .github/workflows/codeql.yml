name: CodeQL

# Static security analysis (SAST) — MANUAL-ONLY (workflow_dispatch).
#
# The repo goes PRIVATE on 2026-10-01. On a personal-account private repo, code scanning cannot
# upload SARIF to the Security tab (that needs org-level GitHub Advanced Security), and every
# hosted job-minute is billed — so running CodeQL automatically on each push/PR would both fail
# at the upload step AND burn billable minutes. The two `Analyze (...)` contexts have also been
# dropped from main's required checks (planning #37), so this no longer needs to run per-PR.
#
# It is kept as a manual full scan you can trigger from the Actions tab while the repo is still
# public (results reach the Security tab until the privacy flip). For ongoing coverage once
# private, use the local CodeQL CLI runbook (planning #39) — that runs off GitHub, zero minutes.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode "none" analyzes source without a full compile — sidesteps the .NET SDK
          # setup and works with the multi-project layout.
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
